<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTMLプレイヤー v0.1 ― カートリッジを差して遊ぶ</title>
<style>
  html,body{margin:0;padding:0;background:#14100d;color:#f3e9d2;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;-webkit-tap-highlight-color:transparent}
  #wrap{max-width:600px;margin:0 auto;padding:12px 10px 24px}
  header{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid #8a6b3f;padding-bottom:8px}
  h1{font-size:19px;letter-spacing:.12em;margin:0}
  .ver{font-size:11px;color:#c9b48a;border:1px solid #8a6b3f;border-radius:3px;padding:1px 6px}
  #cartName{font-size:14px;color:#e8cf9a;margin:10px 2px 6px;min-height:20px}
  #stage{background:#000;border:2px solid #8a6b3f;border-radius:6px;overflow:hidden}
  #screen{width:100%;height:72vh;border:0;display:block;background:#201612}
  #stage:fullscreen #screen{height:100%}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  button,select,input{font-family:inherit;font-size:14px}
  button{background:#7c2128;color:#fff;border:1px solid #d8b46a;border-radius:6px;padding:9px 14px;cursor:pointer;letter-spacing:.08em}
  button:active{background:#5f181e}
  select{background:#241a12;color:#f3e9d2;border:1px solid #8a6b3f;border-radius:6px;padding:9px}
  input{flex:1;min-width:180px;background:#241a12;color:#f3e9d2;border:1px solid #8a6b3f;border-radius:6px;padding:9px}
  .note{font-size:12px;color:#b7a67f;line-height:1.8;margin-top:14px}
  #toast{font-size:13px;color:#9fd48a;min-height:18px;margin-top:6px}
</style>
</head>
<body>
<div id="wrap">
  <header><h1>HTMLプレイヤー</h1><span class="ver">v0.2</span></header>
  <div id="cartName">カートリッジ: （読み込み中）</div>
  <div id="stage"><iframe id="screen" title="game screen" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-modals" allowfullscreen></iframe></div>
  <div class="row">
    <select id="cart">
      <option value="https://oosawak.github.io/ikkiuchi/">一騎討ち ― 刹那の一閃</option>
      <option value="https://oosawak.github.io/hitori-mahjong/">一人麻雀</option>
      <option value="https://oosawak.github.io/shanghai/">上海 ― 牌消し</option>
      <option value="custom">URLを指定する…</option>
    </select>
    <button id="reload">リロード</button>
    <button id="full">フルスクリーン</button>
    <button id="share">共有URLをコピー</button>
  </div>
  <div class="row" id="customRow" style="display:none">
    <input id="urlBox" type="url" placeholder="ゲームのURL（https://…）">
    <button id="loadBtn">差し替える</button>
  </div>
  <div id="toast"></div>
  <div class="note">
    カートリッジは普通のHTMLページです。URLを指定すれば、どのサイトのゲームでも差して遊べます。<br>
    共有URLの形: このプレイヤーのURL ＋ <b>?game=ゲームのURL</b><br>
    URLの中にゲーム本体を埋め込む形（#p= ペイロード）にも対応しています。
  </div>
</div>
<script>
"use strict";
const screen=document.getElementById('screen');
const cartName=document.getElementById('cartName');
const cartSel=document.getElementById('cart');
const customRow=document.getElementById('customRow');
const urlBox=document.getElementById('urlBox');
const toast=document.getElementById('toast');
const DEFAULT_GAME="https://oosawak.github.io/ikkiuchi/";
const DEFAULT_TITLE="一騎討ち ― 刹那の一閃";
let current={type:"url",value:DEFAULT_GAME,title:DEFAULT_TITLE};

function say(t){toast.textContent=t;setTimeout(()=>{if(toast.textContent===t)toast.textContent="";},2600);}
function loadURL(url,title){
  current={type:"url",value:url,title:title||url};
  screen.removeAttribute('srcdoc');
  screen.src=url;
  cartName.textContent="カートリッジ: "+current.title;
}
async function loadPayload(b64){
  try{
    const bin=atob(b64.replaceAll('-','+').replaceAll('_','/'));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    current={type:"payload",value:b64,title:"URL埋め込みカートリッジ"};
    screen.removeAttribute('src');
    screen.srcdoc=html;
    cartName.textContent="カートリッジ: URL埋め込みカートリッジ";
  }catch(e){say("ペイロードを読み込めませんでした");loadURL(DEFAULT_GAME,DEFAULT_TITLE);}
}
function init(){
  const q=new URLSearchParams(location.search);
  if(location.hash.startsWith("#p=")){loadPayload(location.hash.slice(3));return;}
  const g=q.get("game");
  if(g){loadURL(g,q.get("title")||g);
    for(const o of cartSel.options){if(o.value===g)cartSel.value=g;}
    return;
  }
  loadURL(DEFAULT_GAME,DEFAULT_TITLE);
}
cartSel.addEventListener('change',()=>{
  if(cartSel.value==="custom"){customRow.style.display="flex";urlBox.focus();}
  else{customRow.style.display="none";loadURL(cartSel.value,cartSel.options[cartSel.selectedIndex].textContent);}
});
document.getElementById('loadBtn').addEventListener('click',()=>{
  const u=urlBox.value.trim();if(!u)return;
  loadURL(u,u);say("カートリッジを差し替えました");
});
document.getElementById('reload').addEventListener('click',()=>{
  if(current.type==="payload"){const h=screen.srcdoc;screen.srcdoc=h;}
  else{screen.src=current.value;}
});
document.getElementById('full').addEventListener('click',()=>{
  const st=document.getElementById('stage');
  if(st.requestFullscreen)st.requestFullscreen();
});
document.getElementById('share').addEventListener('click',async()=>{
  let url;
  if(current.type==="payload"){url=location.origin+location.pathname+"#p="+current.value;}
  else{url=location.origin+location.pathname+"?game="+encodeURIComponent(current.value);}
  try{await navigator.clipboard.writeText(url);say("共有URLをコピーしました");}
  catch(e){urlBox.value=url;customRow.style.display="flex";say("コピーできませんでした。欄のURLを使ってください");}
});
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詰め込みURL テスト</title>
<style>body{background:#111;color:#ddd;font-family:sans-serif;margin:16px}iframe{width:512px;height:512px;border:1px solid #555;max-width:92vw;aspect-ratio:1}</style>
</head>
<body>
<p id="st">復号しています…</p>
<iframe id="f" sandbox="allow-scripts allow-pointer-lock"></iframe>
<script>
"use strict";
const RANGES=[[0x3400,0x4DBF],[0x4E00,0x9FFF],[0xAC00,0xBFFF],[0xC000,0xC03F]];
const REV=new Map();
{let i=0;for(const [a,b] of RANGES)for(let c=a;c<=b;c++)REV.set(String.fromCodePoint(c),i++);}
async function main(){
  const st=document.getElementById("st");
  let packed=(location.hash||"").replace(/^#u=/,"");
  try{ packed=decodeURIComponent(packed); }catch(e){}
  if(!packed||packed===location.hash){st.textContent="URLの #u= の後ろにデータがありません。";return}
  const chars=Array.from(packed);
  const vals=chars.map(ch=>REV.get(ch));
  if(vals.some(v=>v===undefined)){st.textContent="読めない文字が含まれています。";return}
  const n=(vals[0]<<15)|vals[1];
  const out=new Uint8Array(n);
  let acc=0,nbits=0,written=0;
  for(let i=2;i<vals.length&&written<n;i++){
    acc=acc*32768+vals[i];nbits+=15;
    while(nbits>=8&&written<n){nbits-=8;out[written++]=Math.floor(acc/2**nbits)%256;acc%=2**nbits;}
  }
  const stream=new Blob([out]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  document.getElementById("f").srcdoc=html;
  st.textContent="復号できました（"+chars.length+"文字 → ゲーム "+html.length+" バイト）。ゲーム画面が出れば成功です。";
}
main().catch(e=>{document.getElementById("st").textContent="復号に失敗しました: "+e.message});
</script>
</body>
</html>

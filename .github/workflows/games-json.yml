name: games.json 自動生成

# ゲームの登録（games/*/game.md など）が push されたら、
# プレイヤーが読む games.json を作り直してコミットする。
# games.json 自体のコミットでは起動しない（paths に含めていない）。

on:
  push:
    branches: [main]
    paths:
      - "games/**"
      - "tools/build-games-json.py"
      - "tools/unzip-games.py"
      - ".github/workflows/games-json.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: zip カセットを展開
        run: python3 tools/unzip-games.py
      - name: games.json を生成
        run: python3 tools/build-games-json.py
      - name: 変わっていたらコミット
        run: |
          if [ -z "$(git status --porcelain -- games.json sw-manifest.json games)" ]; then
            echo "変更はありません"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add games.json sw-manifest.json games
            git commit -m "games.json を自動生成"
            git push
          fi

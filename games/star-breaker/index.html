<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>スターブレイカー ― 宇宙シューティング</title>
<script src="https://oosawak.github.io/html-player/assets/hp.js"></script>
<style>
body{margin:0;background:#05070f;color:#dfe9ff;font-family:"HP Sans",sans-serif;text-align:center;-webkit-tap-highlight-color:transparent}
#w{max-width:480px;margin:auto;padding:10px}
h1{font-size:19px;letter-spacing:.14em;margin:4px}
.s{font-size:12px;color:#8fa5cc}
canvas{width:100%;background:#02030a;border:1px solid #39558a;border-radius:6px;touch-action:none;display:block;margin:8px auto}
.note{font-size:11px;color:#8498bd;line-height:1.7;text-align:left}
</style></head><body><div id="w">
<h1>スターブレイカー</h1>
<div class="s">全方位から敵が来る。ショットは自動で一番近い敵を追尾する。</div>
<canvas id="cv" width="480" height="360"></canvas>
<div class="note">・タッチ（ドラッグ）か十字キーで移動<br>・ショットは自動。撃つとエネルギー消費、倒すと少し回復<br>・敵に当たると減る。0でミッション失敗</div>
</div><script>
"use strict";
const cv=document.getElementById("cv"),g=cv.getContext("2d");
const W=480,H=360;
let state=0,score=0,best=0,energy=100,fireWait=0,invuln=0,spawnT=0,t=0,playT=0;
try{best=+localStorage.getItem("sb")||0}catch(e){}
const ship={x:W/2,y:H/2,ang:-Math.PI/2,aim:-Math.PI/2,aimT:9};
let bullets=[],foes=[],stars=[];
for(let i=0;i<44;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.4+0.3});
let touch=null;
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener("pointerdown",e=>{touch=pos(e);if(state!==1)start()});
cv.addEventListener("pointermove",e=>{if(touch)touch=pos(e)});
addEventListener("pointerup",()=>touch=null);
function start(){
 state=1;score=0;energy=100;playT=0;bullets=[];foes=[];spawnT=0;invuln=0;
 ship.x=W/2;ship.y=H/2;ship.ang=-Math.PI/2;
}
function circle(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function spawnFoe(){
 const a=Math.random()*Math.PI*2,d=330,big=Math.random()<0.12;
 const r=big?24:9+Math.random()*7;
 foes.push({x:ship.x+Math.cos(a)*d,y:ship.y+Math.sin(a)*d,r:r,big:big,hp:5,
  vy:(big?17:30)+Math.random()*26+playT*0.7,col:big?"#d88f2c":(r<13?"#c06ae0":"#e05252")});
}
HP.loop(dt=>{
 t+=dt;
 if(state!==1&&HP.bHit())start();
 g.fillStyle="#02030a";g.fillRect(0,0,W,H);
 g.fillStyle="#afc4ee";
 stars.forEach(s=>{g.fillRect(s.x,s.y,2,2)});
 if(state===1){
  playT+=dt;ship.aimT+=dt;
  let mx=0,my=0;
  if(HP.left())mx-=1;
  if(HP.right())mx+=1;
  if(HP.up())my-=1;
  if(HP.down())my+=1;
  if(touch){
   const dx=touch.x-ship.x,dy=touch.y-ship.y,dd=Math.hypot(dx,dy);
   if(dd>6){mx=dx/dd;my=dy/dd}
  }
  if(mx||my){
   const ml=Math.hypot(mx,my);
   ship.x+=mx/ml*205*dt;ship.y+=my/ml*205*dt;
   ship.ang=Math.atan2(my,mx);
  }
  ship.x=Math.max(14,Math.min(W-14,ship.x));
  ship.y=Math.max(30,Math.min(H-14,ship.y));
  fireWait-=dt;
  if(fireWait<=0&&foes.length&&energy>=3){
   let tgt=null,bd=40000;
   for(const f of foes){const dd=(f.x-ship.x)**2+(f.y-ship.y)**2;if(dd<bd){bd=dd;tgt=f}}
   if(tgt){
    const a=Math.atan2(tgt.y-ship.y,tgt.x-ship.x);
    ship.aim=a;ship.aimT=0;
    bullets.push({x:ship.x,y:ship.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,tgt:tgt,life:0.8});
    energy-=3;fireWait=0.25;HP.beep(880,0.05);
   }
  }
  energy=Math.min(100,energy+9*dt);
  spawnT-=dt;
  if(spawnT<=0){spawnFoe();spawnT=Math.max(0.3,1.0-playT*0.012)}
  if(invuln>0)invuln-=dt;
 }
 bullets.forEach(b=>{
  b.life-=dt;
  if(b.tgt&&foes.indexOf(b.tgt)>=0){
   const a=Math.atan2(b.tgt.y-b.y,b.tgt.x-b.x),ca=Math.atan2(b.vy,b.vx);
   let da=a-ca;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
   const na=ca+Math.max(-7*dt,Math.min(7*dt,da));
   b.vx=Math.cos(na)*300;b.vy=Math.sin(na)*300;
  }
  b.x+=b.vx*dt;b.y+=b.vy*dt;
 });
 bullets=bullets.filter(b=>b.life>0&&b.x>-10&&b.x<W+10&&b.y>-10&&b.y<H+10);
 foes.forEach(f=>{
  const a=Math.atan2(ship.y-f.y,ship.x-f.x),sp=f.vy;
  f.x+=Math.cos(a)*sp*dt;f.y+=Math.sin(a)*sp*dt;
 });
 foes=foes.filter(f=>{
  for(const b of bullets){
   if(!b.hit&&Math.hypot(b.x-f.x,b.y-f.y)<f.r+3){
    b.hit=true;HP.beep(220,0.07);
    if(f.big){f.hp--;if(f.hp>0)return true;score+=500}
    else score+=f.r<13?150:100;
    energy=Math.min(100,energy+2);return false;
   }
  }
  if(invuln<=0&&Math.hypot(ship.x-f.x,ship.y-f.y)<f.r+11){
   energy-=f.big?18:12;invuln=f.big?1:0.8;HP.beep(90,0.25,"sawtooth",0.05);
   if(f.big){const a=Math.atan2(f.y-ship.y,f.x-ship.x);f.x+=Math.cos(a)*34;f.y+=Math.sin(a)*34;return true}
   return false;
  }
  return true;
 });
 bullets=bullets.filter(b=>!b.hit);
 if(state===1){
  if(energy<=0){energy=0;state=2;if(score>best){best=score;try{localStorage.setItem("sb",best)}catch(e){}}}
 }
 foes.forEach(f=>{circle(f.x,f.y,f.r,f.col);if(f.big)HP.bar(g,f.x-18,f.y-f.r-11,36,5,f.hp/5,"#ffd94a")});
 g.fillStyle="#ffe9a8";
 bullets.forEach(b=>circle(b.x,b.y,3,"#ffe9a8"));
 if(state!==2&&!(invuln>0&&((t*10)|0)%2)){
  g.save();g.translate(ship.x,ship.y);g.rotate(ship.aimT<0.3?ship.aim:ship.ang);
  g.fillStyle="#57b7ff";
  g.beginPath();g.moveTo(15,0);g.lineTo(-11,-11);g.lineTo(-5,0);g.lineTo(-11,11);g.closePath();g.fill();
  g.restore();
 }
 HP.text(g,"SCORE "+score,10,18,13,"#dfe9ff");
 HP.text(g,"HI "+best,W-10,18,13,"#dfe9ff","right");
 HP.text(g,"ENERGY",10,36,13,"#dfe9ff");
 HP.bar(g,76,26,180,10,energy/100,energy>30?"#57e08a":"#e05252");
 if(state===0)HP.title(g,W,H,"STAR BREAKER",["敵は全方位から来る。ショットは自動追尾","エネルギーが尽きたらミッション失敗","Bボタンかタップでスタート"],"#dfe9ff");
 if(state===2)HP.title(g,W,H,"SIGNAL LOST",["MISSION FAILED ― SCORE "+score,"Bボタンかタップでもう一度"],"#dfe9ff");
});
</script></body></html>

<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src https://oosawak.github.io 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>一騎討ち ― 刹那の一閃</title><style>body{margin:0;background:#1a1210;color:#f3e9d2;font-family:"HP Denki",serif;text-align:center;-webkit-tap-highlight-color:transparent}#w{max-width:520px;margin:auto;padding:10px}h1{font-size:19px;letter-spacing:.15em;margin:4px}.s{font-size:12px;color:#c9b48a}canvas{width:100%;background:#2b1a12;border:2px solid #8a6b3f;border-radius:6px;display:block}#m{min-height:42px;font-size:15px;line-height:1.5;margin:8px;white-space:pre-wrap}button{font-size:16px;padding:11px 30px;background:#7c2128;color:#fff;border:1px solid #d8b46a;border-radius:6px;letter-spacing:.2em;font-family:inherit}.r{font-size:11px;color:#b7a67f;line-height:1.7;text-align:left;margin-top:10px}</style></head><body><div id="w"><h1>一騎討ち ― 刹那の一閃</h1><div class="s">「！」が出たら、相手より早く斬れ。5人抜きの反射勝負。</div><canvas id="cv" width="480" height="360"></canvas><div id="m">心を静めよ。合図まで動くな。</div><button id="b">いざ、尋常に</button><div class="r">・画面タップ（またはスペース）が「斬る」動作<br>・「！」の前に斬ると「お手つき」。2回で敗北<br>・反応は右下の札に1/60秒単位で表示（小さいほど速い）<br>・相手は勝ち進むほど速くなる</div></div><script>"use strict";const cv=document.getElementById("cv"),x=cv.getContext("2d"),M=document.getElementById("m"),B=document.getElementById("b");const F=[["足軽 与一",30],["槍侍 権三",25],["荒武者 岩鉄",20],["剣豪 左近",16],["猛将 鬼武蔵",13]];let S="title",R=0,FL=0,WU=0,SA=0,FS=0,ST=0,RF=null,BT=null,AC=null;try{BT=localStorage.getItem("ik")}catch(e){}function beep(f,d,t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.type=t||"square";o.frequency.value=f;g.gain.setValueAtTime(.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}function foe(){return F[Math.min(R,4)]}function round(){FL=0;RF=null;S="wait";WU=performance.now()+1200+Math.random()*2300;M.textContent="第"+(R+1)+"の相手、"+foe()[0]+"。\n合図を待て……";B.textContent="斬る（タップ）";draw()}function slash(){let n=performance.now();if(S==="wait"){FL++;beep(140,.18,"sawtooth");if(FL>=2){S="lose";M.textContent="お手つき2回。勝負は相手のもの。\n"+R+"人抜きで終わった。";B.textContent="もう一度"}else{S="foul";M.textContent="お手つき！ あと1回で敗北。仕切り直し。";B.textContent="仕切り直す"}draw();return}if(S==="signal"){let fr=Math.round((n-SA)/1000*60);RF=fr;ST=n;beep(880,.07);if(fr<FS){if(BT===null||fr<+BT){BT=fr;try{localStorage.setItem("ik",fr)}catch(e){}}R++;if(R>=5){S="clear";M.textContent="5人抜き達成！見事な一閃。\n最速記録: "+BT+"（1/60秒）";B.textContent="最初から"}else{S="win";M.textContent="斬った！反応 "+fr+"。相手は "+FS+"。\n次は "+foe()[0]+"。"+R+"人抜き。";B.textContent="次の相手へ"}}else{S="lose";M.textContent="遅れた……反応 "+fr+"、相手は "+FS+"。\n"+R+"人抜きで終わった。";B.textContent="もう一度"}draw()}}function tick(){let n=performance.now();if(S==="wait"&&n>=WU){S="signal";SA=n;FS=foe()[1]+Math.round(Math.random()*4-2);beep(1320,.06);draw()}if(S==="signal"&&n-SA>=FS/60*1000+40){ST=n;beep(196,.3,"sawtooth");S="lose";M.textContent="相手の方が速かった……\n"+R+"人抜きで終わった。";B.textContent="もう一度";draw()}requestAnimationFrame(tick)}function fighter(p,f,c,dn){x.save();x.translate(p,268);if(f)x.scale(-1,1);if(dn){x.translate(10,26);x.rotate(1.35)}x.fillStyle=c;x.beginPath();x.arc(0,-64,11,0,7);x.fill();x.fillRect(-4,-56,8,10);x.beginPath();x.moveTo(-13,-48);x.lineTo(13,-48);x.lineTo(9,10);x.lineTo(-9,10);x.closePath();x.fill();x.fillRect(-11,10,8,26);x.fillRect(3,10,8,26);x.strokeStyle=c;x.lineWidth=6;x.beginPath();x.moveTo(8,-40);x.lineTo(28,-22);x.stroke();x.strokeStyle="#ddd";x.lineWidth=4;x.beginPath();x.moveTo(28,-22);x.lineTo(52,-34);x.stroke();x.restore()}function draw(){let g=x.createLinearGradient(0,0,0,360);g.addColorStop(0,"#3a1f16");g.addColorStop(.7,"#a4502e");g.addColorStop(1,"#5e2f1a");x.fillStyle=g;x.fillRect(0,0,480,360);x.fillStyle="#e8a34f";x.beginPath();x.arc(240,238,58,0,7);x.fill();x.fillStyle="#241207";x.fillRect(0,268,480,92);if(S==="foul"||S==="lose"){x.fillStyle="rgba(0,0,0,.45)";x.fillRect(0,0,480,360)}fighter(150,0,"#2e4a7c",S==="lose");fighter(330,1,"#7c2128",S==="win"||S==="clear");if(S==="signal"||((S==="win"||S==="lose")&&RF!==null)){x.fillStyle="#fff";x.font="bold 92px 'HP Denki',sans-serif";x.textAlign="center";x.fillText("！",240,120)}if(S==="foul"||S==="lose"){x.strokeStyle="#e33";x.lineWidth=7;x.beginPath();x.moveTo(132,150);x.lineTo(168,186);x.moveTo(168,150);x.lineTo(132,186);x.stroke()}if(ST&&(S==="win"||S==="clear")){x.strokeStyle="rgba(255,255,255,.9)";x.lineWidth=3;x.beginPath();x.moveTo(196,180);x.lineTo(300,236);x.stroke()}x.fillStyle="#e9dcc0";x.fillRect(404,286,58,52);x.strokeStyle="#6b4a21";x.lineWidth=3;x.strokeRect(404,286,58,52);x.fillStyle="#222";x.font="bold 26px 'HP Denki',sans-serif";x.textAlign="center";x.fillText(RF!==null?RF:"--",433,324);x.font="10px 'HP Denki',sans-serif";x.fillText("1/60秒",433,334);x.fillStyle="#f3e9d2";x.font="15px 'HP Denki',sans-serif";x.textAlign="left";x.fillText(S==="title"?"向かい合う両者":"相手: "+foe()[0]+" 勝ち抜き "+R+" お手つき "+FL,12,24);if(BT!==null){x.textAlign="right";x.fillText("最速 "+BT,468,24)}}B.onclick=()=>{if(S==="title"||S==="lose"||S==="clear"){R=0;round()}else if(S==="win")round();else if(S==="foul"){S="wait";WU=performance.now()+1200+Math.random()*2300;M.textContent="仕切り直し。合図を待て……";B.textContent="斬る（タップ）";draw()}else slash()};cv.onpointerdown=e=>{e.preventDefault();if(S==="wait"||S==="signal")slash()};document.onkeydown=e=>{if(e.code==="Space"||e.code==="Enter"||e.code==="KeyX"){e.preventDefault();if(S==="wait"||S==="signal")slash();else B.click()}};draw();requestAnimationFrame(tick);</script>
<script>
/* 入力ブリッジ: 物理ゲームパッドと画面コントローラーの入力を、キー操作に変換する */
(function(){
  "use strict";
  function fire(type, code){
    document.dispatchEvent(new KeyboardEvent(type, {code: code, key: code === "Space" ? " " : code, bubbles: true, cancelable: true}));
  }
  var held = {};
  function set(code, down){
    if (held[code] === down) return;
    held[code] = down;
    fire(down ? "keydown" : "keyup", code);
  }
  addEventListener("message", function(e){
    var d = e.data;
    if (!d || d.t !== "hp-key" || typeof d.code !== "string") return;
    set(d.code, !!d.down);
  });
  var MAP = [[12,"ArrowUp"],[13,"ArrowDown"],[14,"ArrowLeft"],[15,"ArrowRight"],[0,"Space"],[1,"KeyX"],[2,"KeyZ"],[3,"KeyC"],[4,"ShiftLeft"],[5,"ShiftRight"]];
  var sysPrev = {6:false, 7:false};
  setInterval(function(){
    var gps;
    try { gps = navigator.getGamepads ? navigator.getGamepads() : []; } catch(e){ return; }
    var gp = null;
    for (var i = 0; i < gps.length; i++) { if (gps[i]) { gp = gps[i]; break; } }
    if (!gp) return;
    var b = gp.buttons || [], ax = gp.axes || [];
    function btn(n){ return !!(b[n] && b[n].pressed); }
    for (var j = 0; j < MAP.length; j++) {
      var code = MAP[j][1], down = btn(MAP[j][0]);
      if (code === "ArrowLeft") down = down || ax[0] < -0.5;
      if (code === "ArrowRight") down = down || ax[0] > 0.5;
      if (code === "ArrowUp") down = down || ax[1] < -0.5;
      if (code === "ArrowDown") down = down || ax[1] > 0.5;
      set(code, down);
    }
    [6, 7].forEach(function(n){
      var down = btn(n);
      if (down && !sysPrev[n]) { try { parent.postMessage({t: "hp-sys", btn: n === 6 ? "l2" : "r2"}, "*"); } catch(e){} }
      sysPrev[n] = down;
    });
  }, 16);
})();
</script>

<script>
/* 画面に収まるよう自動で縮小する（スクロールなしで全体が見えるように） */
(function(){
  function fit(){
    var de = document.documentElement;
    de.style.zoom = "";
    var z = Math.min(1, (innerHeight - 4) / de.scrollHeight, (innerWidth - 4) / de.scrollWidth);
    if (z < 1) {
      de.style.zoom = z;
      for (var i = 0; i < 3 && de.scrollHeight > de.clientHeight; i++) {
        z = z * (de.clientHeight / de.scrollHeight) * 0.99;
        de.style.zoom = z;
      }
    }
  }
  addEventListener("resize", fit);
  addEventListener("load", function(){
    fit();
    var n = 0;
    var iv = setInterval(function(){ fit(); if (++n >= 12) clearInterval(iv); }, 400);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fit(); });
  });
  fit();
})();
</script>
</body></html>

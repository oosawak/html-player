<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src https://oosawak.github.io 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<title>セキュリティ確認サンプル</title>
<style>
  body { margin:0; background:#14161c; color:#e8eaf2; font-family:"HP Denki",sans-serif; padding:14px; }
  h1 { font-size:19px; margin:2px 0 4px; }
  p.lead { font-size:13px; color:#aab; margin:0 0 12px; line-height:1.6; }
  .row { display:flex; gap:8px; align-items:baseline; padding:7px 9px; background:#1d2027; border-radius:8px; margin-bottom:6px; font-size:14px; }
  .st { font-weight:bold; white-space:nowrap; }
  .ok { color:#5fd68a; } .bad { color:#ff7070; } .wait { color:#e8c95a; }
  .name { flex:1; }
  h2 { font-size:15px; margin:16px 0 6px; }
  button { background:#2b6cb0; color:#fff; border:0; border-radius:8px; padding:9px 12px; font-size:14px; margin:0 6px 6px 0; }
  button.danger { background:#9b2c2c; }
  .note { font-size:12px; color:#99a; line-height:1.6; }
</style>
</head>
<body>
<h1>セキュリティ確認サンプル</h1>
<p class="lead">このカセットは、プレイヤーの隔離（サンドボックス）が効いているかを確かめるための攻撃テストです。読み込むと自動で確認が始まります。「遮断」が並べば正常です。</p>
<div id="list"></div>
<h2>ボタンで確かめる項目</h2>
<button id="b-dialog">ダイアログ表示テスト</button>
<button id="b-popup">別ウィンドウテスト</button>
<button id="b-top">画面まるごと遷移テスト</button>
<button id="b-form">フォーム送信テスト</button>
<div id="manual"></div>
<h2>暴走テスト</h2>
<p class="note">下のボタンを押すと無限ループに入ります。プレイヤーの「暴走検知」がオンなら、数秒でプレイヤー側が止めて、枠の上にメッセージが出ます。</p>
<button id="b-run" class="danger">暴走テストを開始（無限ループ）</button>
<script src="https://oosawak.github.io/html-player/assets/hp.js?v=6"></script>
<script>
const list = document.getElementById("list");
const rows = {};
function row(id, name){
  const d = document.createElement("div"); d.className = "row";
  d.innerHTML = '<span class="st wait">確認中</span><span class="name"></span>';
  d.querySelector(".name").textContent = name;
  list.appendChild(d); rows[id] = d.querySelector(".st");
}
function set(id, ok, label){
  const s = rows[id]; if(!s) return;
  s.textContent = label || (ok ? "遮断" : "通ってしまった");
  s.className = "st " + (ok ? "ok" : "bad");
}
row("script","スクリプトの実行（対照：これは動くのが正常）");
row("storage","記録の保存（localStorage）");
row("cookie","クッキーの読み書き");
row("parent","親ページ（プレイヤー本体）へのアクセス");
row("fetch","外部への通信（fetch）");
row("img","外部サイトの画像の読み込み");
set("script", true, "動作OK");
try { localStorage.setItem("sectest","1"); localStorage.removeItem("sectest"); set("storage", false); }
catch(e){ set("storage", true); }
try { document.cookie = "sectest=1"; set("cookie", document.cookie.indexOf("sectest") < 0); }
catch(e){ set("cookie", true); }
try { const d = window.parent.document; set("parent", !(d && d.title !== undefined && window.parent.location.href.indexOf("html-player") >= 0 && !!d.querySelector("#cart"))); }
catch(e){ set("parent", true); }
let fetchDone = false;
setTimeout(()=>{ if(!fetchDone) set("fetch", true); }, 3000);
fetch("https://example.com/").then(()=>{ fetchDone = true; set("fetch", false); }).catch(()=>{ fetchDone = true; set("fetch", true); });
let imgDone = false;
const im = new Image();
im.onload = ()=>{ imgDone = true; set("img", false); };
im.onerror = ()=>{ imgDone = true; set("img", true); };
setTimeout(()=>{ if(!imgDone) set("img", true); }, 3000);
im.src = "https://example.com/favicon.ico";
const man = document.getElementById("manual");
function mrow(name){
  const d = document.createElement("div"); d.className = "row";
  d.innerHTML = '<span class="st wait">未実施</span><span class="name"></span>';
  d.querySelector(".name").textContent = name; man.appendChild(d);
  return d.querySelector(".st");
}
const stDlg = mrow("ダイアログ（alert）");
const stPop = mrow("別ウィンドウを開く（window.open）");
const stTop = mrow("画面まるごと遷移（top.location）");
const stForm = mrow("フォーム送信");
function mset(s, ok){ s.textContent = ok ? "遮断" : "通ってしまった"; s.className = "st " + (ok ? "ok" : "bad"); }
document.getElementById("b-dialog").onclick = () => {
  stDlg.textContent = "実施済み（ダイアログが出なければ遮断）"; stDlg.className = "st ok";
  setTimeout(()=>{ try { alert("これが見えたら、ダイアログは遮断されていません"); } catch(e){} }, 50);
};
document.getElementById("b-popup").onclick = () => {
  const w = window.open("https://example.com", "_blank");
  mset(stPop, !w);
};
document.getElementById("b-top").onclick = () => {
  try { window.top.location.href = "https://example.com/"; } catch(e){}
  setTimeout(()=>mset(stTop, true), 1200);
};
document.getElementById("b-form").onclick = () => {
  const f = document.createElement("form");
  f.method = "GET"; f.action = "https://example.com/";
  document.body.appendChild(f);
  try { f.submit(); } catch(e){}
  setTimeout(()=>mset(stForm, true), 1200);
};
document.getElementById("b-run").onclick = () => { while(true){} };
</script>

<script>
/* 入力ブリッジ: 物理ゲームパッドと画面コントローラーの入力を、キー操作に変換する */
(function(){
  "use strict";
  function fire(type, code){
    document.dispatchEvent(new KeyboardEvent(type, {code: code, key: code === "Space" ? " " : code, bubbles: true, cancelable: true}));
  }
  var held = {};
  function set(code, down){
    if (held[code] === down) return;
    held[code] = down;
    fire(down ? "keydown" : "keyup", code);
  }
  addEventListener("message", function(e){
    var d = e.data;
    if (!d || d.t !== "hp-key" || typeof d.code !== "string") return;
    set(d.code, !!d.down);
  });
  var MAP = [[12,"ArrowUp"],[13,"ArrowDown"],[14,"ArrowLeft"],[15,"ArrowRight"],[0,"Space"],[1,"KeyX"],[2,"KeyZ"],[3,"KeyC"],[4,"ShiftLeft"],[5,"ShiftRight"]];
  var sysPrev = {6:false, 7:false};
  setInterval(function(){
    var gps;
    try { gps = navigator.getGamepads ? navigator.getGamepads() : []; } catch(e){ return; }
    var gp = null;
    for (var i = 0; i < gps.length; i++) { if (gps[i]) { gp = gps[i]; break; } }
    if (!gp) return;
    var b = gp.buttons || [], ax = gp.axes || [];
    function btn(n){ return !!(b[n] && b[n].pressed); }
    for (var j = 0; j < MAP.length; j++) {
      var code = MAP[j][1], down = btn(MAP[j][0]);
      if (code === "ArrowLeft") down = down || ax[0] < -0.5;
      if (code === "ArrowRight") down = down || ax[0] > 0.5;
      if (code === "ArrowUp") down = down || ax[1] < -0.5;
      if (code === "ArrowDown") down = down || ax[1] > 0.5;
      set(code, down);
    }
    [6, 7].forEach(function(n){
      var down = btn(n);
      if (down && !sysPrev[n]) { try { parent.postMessage({t: "hp-sys", btn: n === 6 ? "l2" : "r2"}, "*"); } catch(e){} }
      sysPrev[n] = down;
    });
  }, 16);
})();
</script>

<style>button:focus{outline:3px solid #35c4ff;outline-offset:1px}</style>
<script>
"use strict";
/* カーソル操作: 十字キーでボタン間を移動、A（Space）で決定 */
(function(){
  function items(){ return Array.prototype.filter.call(document.querySelectorAll("button"), function(el){
    var r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && !el.disabled; }); }
  function ctr(el){ var r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
  var lastEl = null, lastIdx = 0;
  function paint(i){ var list = items(); if (!list.length) return;
    i = Math.max(0, Math.min(i, list.length - 1)); lastIdx = i; lastEl = list[i]; list[i].focus(); }
  function move(dir){
    var list = items(); if (!list.length) return;
    var j = list.indexOf(document.activeElement);
    if (j < 0) { paint(lastIdx); return; }
    var c = ctr(list[j]), best = -1, bestScore = 1e18;
    list.forEach(function(el, m){
      if (m === j) return;
      var o = ctr(el), dx = o.x - c.x, dy = o.y - c.y, primary, cross;
      if (dir === "left") { if (dx >= -4) return; primary = -dx; cross = Math.abs(dy); }
      else if (dir === "right") { if (dx <= 4) return; primary = dx; cross = Math.abs(dy); }
      else if (dir === "up") { if (dy >= -4) return; primary = -dy; cross = Math.abs(dx); }
      else { if (dy <= 4) return; primary = dy; cross = Math.abs(dx); }
      var score = primary + cross * 3;
      if (score < bestScore) { bestScore = score; best = m; }
    });
    if (best >= 0) paint(best);
  }
  document.addEventListener("keydown", function(e){
    if (e.code.indexOf("Arrow") === 0) { e.preventDefault(); move(e.code.slice(5).toLowerCase()); }
  });
  new MutationObserver(function(){
    if (lastEl && !document.contains(lastEl)) paint(lastIdx);
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
</body>
</html>

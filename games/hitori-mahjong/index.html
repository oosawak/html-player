<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src https://oosawak.github.io 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>一人麻雀 ― ツモって切って、和了を目指す</title>
<style>
body{margin:0;background:#0d3b2e;color:#f3e9d2;font-family:serif;text-align:center;-webkit-tap-highlight-color:transparent}
#w{max-width:560px;margin:auto;padding:10px}
h1{font-size:19px;letter-spacing:.12em;margin:4px}
.s{font-size:12px;color:#bcd8c8}
#st{min-height:44px;font-size:15px;line-height:1.5;margin:8px 2px;white-space:pre-wrap}
#hand{display:flex;flex-wrap:nowrap;gap:2px;margin:12px 0;justify-content:center}
.t{flex:1 1 0;min-width:0;background:#f7f2df;border:1px solid #8a8a7a;border-bottom:3px solid #b0a888;border-radius:5px;cursor:pointer;padding:4px 0;line-height:1.1;color:#222}
.t .n{display:block;font-size:17px;font-weight:bold}
.t .k{display:block;font-size:13px}
.t.man .k{color:#333}
.t.sou .k{color:#1d7a3a}
.t.pin .k{color:#2050a0}
.t.new{outline:3px solid #e8a34f}
.t:active{transform:translateY(2px)}
#river{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin:8px auto;max-width:480px;min-height:22px}
.r{font-size:12px;background:#e9e4cf;border-radius:3px;padding:2px 4px;color:#333}
button.act{font-size:15px;padding:10px 26px;background:#7c2128;color:#fff;border:1px solid #d8b46a;border-radius:6px;letter-spacing:.15em;font-family:inherit;cursor:pointer}
.note{font-size:11px;color:#9fc4ae;line-height:1.7;text-align:left;margin-top:12px}
</style></head><body><div id="w">
<h1>一人麻雀</h1>
<div class="s">ツモって切って、自分の手だけで和了（アガリ）を目指す一人打ち。</div>
<div id="st"></div>
<div id="hand"></div>
<div id="river"></div>
<button class="act" id="restart">最初から</button>
<div class="note">・牌は萬子・索子・筒子の数牌のみ（各1〜9、4枚ずつ、合計108枚）<br>・ツモは30回まで。和了するか、30回で流局<br>・シャンテン数（和了までの近さ）と、テンパイ時の待ち牌を表示します<br>・役は簡易判定（七対子・タンヤオ・清一色）</div>
</div><script>
"use strict";
//CORE-START
function counts(hand){const c=new Array(27).fill(0);for(const t of hand)c[t]++;return c}
function shanten(cnt){
 let best=8;
 function dfs(c,m,t,head){
  let i=0;while(i<27&&c[i]===0)i++;
  if(i===27){let tt=t;if(m+tt>4)tt=4-m;const s=8-2*m-tt-head;if(s<best)best=s;return}
  c[i]--;dfs(c,m,t,head);c[i]++;
  if(c[i]>=3){c[i]-=3;dfs(c,m+1,t,head);c[i]+=3}
  const n=i%9;
  if(n<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;dfs(c,m+1,t,head);c[i]++;c[i+1]++;c[i+2]++}
  if(!head&&c[i]>=2){c[i]-=2;dfs(c,m,t,1);c[i]+=2}
  if(m+t<4&&c[i]>=2){c[i]-=2;dfs(c,m,t+1,head);c[i]+=2}
  if(m+t<4&&n<=7&&c[i+1]>0){c[i]--;c[i+1]--;dfs(c,m,t+1,head);c[i]++;c[i+1]++}
  if(m+t<4&&n<=6&&c[i+2]>0){c[i]--;c[i+2]--;dfs(c,m,t+1,head);c[i]++;c[i+2]++}
 }
 dfs(cnt.slice(),0,0,0);
 let pairs=0,uniq=0;
 for(let i=0;i<27;i++){if(cnt[i]>=1)uniq++;if(cnt[i]>=2)pairs++}
 const chi=6-pairs+Math.max(0,7-uniq);
 return Math.min(best,chi);
}
function isWin(hand){return shanten(counts(hand))===-1}
function waits(hand){const c=counts(hand),w=[];for(let t=0;t<27;t++){if(c[t]<4){c[t]++;if(shanten(c)===-1)w.push(t);c[t]--}}return w}
function yaku(hand){
 const c=counts(hand),out=[];
 let pairs=0;for(let i=0;i<27;i++)if(c[i]===2)pairs++;
 if(pairs===7)out.push("七対子");
 let simples=true;for(let i=0;i<27;i++){const n=i%9+1;if(c[i]>0&&(n===1||n===9))simples=false}
 if(simples)out.push("タンヤオ");
 const suits=[0,1,2].filter(s=>{for(let i=s*9;i<s*9+9;i++)if(c[i]>0)return true;return false});
 if(suits.length===1)out.push("清一色");
 return out;
}
//CORE-END
const SUITS=["man","sou","pin"],KANJI=["萬","索","筒"];
function label(t){return (t%9+1)+KANJI[(t/9)|0]}
let wall=[],hand=[],river=[],turns=0,over=false,busy=false;
const MAXT=30;
const stEl=document.getElementById("st"),handEl=document.getElementById("hand"),riverEl=document.getElementById("river");
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function status(extra){
 const c=counts(hand);
 let s;
 if(hand.length===13){const sh=shanten(c);
  if(sh===0){const w=waits(hand);s="テンパイ！ 待ち: "+w.map(label).join(" ")}
  else s="あと "+sh+" シャンテン";
 }else s="切る牌を選んでください";
 stEl.textContent="ツモ "+(turns+1)+" / "+MAXT+" 回目　"+s+(extra?"\n"+extra:"");
}
function render(newIdx){
 handEl.innerHTML="";
 hand.forEach((t,i)=>{const b=document.createElement("button");b.className="t "+SUITS[(t/9)|0]+(i===newIdx?" new":"");
  b.innerHTML='<span class="n">'+(t%9+1)+'</span><span class="k">'+KANJI[(t/9)|0]+"</span>";
  b.onclick=()=>discard(i);handEl.appendChild(b)});
 riverEl.innerHTML="";
 river.forEach(t=>{const s=document.createElement("span");s.className="r";s.textContent=label(t);riverEl.appendChild(s)});
}
function draw(){
 if(turns>=MAXT){over=true;const sh=shanten(counts(hand));stEl.textContent="流局。あと "+sh+" シャンテンでした。";render(-1);return}
 const t=wall.pop();hand.push(t);turns++;
 if(isWin(hand)){over=true;const y=yaku(hand);stEl.textContent="和了（ツモ）！ "+turns+" 回目で完成。\n"+(y.length?y.join("・"):"役なし（形の整った和了）");render(hand.length-1);return}
 status();render(hand.length-1);
}
function discard(i){
 if(over||busy||hand.length!==14)return;
 busy=true;
 const t=hand.splice(i,1)[0];river.push(t);
 hand.sort((a,b)=>a-b);
 status();render(-1);
 setTimeout(()=>{busy=false;draw()},420);
}
function start(){
 wall=[];for(let t=0;t<27;t++)for(let k=0;k<4;k++)wall.push(t);
 shuffle(wall);hand=[];river=[];turns=0;over=false;busy=false;
 for(let i=0;i<13;i++)hand.push(wall.pop());
 hand.sort((a,b)=>a-b);
 draw();
}
document.getElementById("restart").onclick=start;
start();
</script></body></html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src https://oosawak.github.io 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<title>CubeBoy</title>
<link rel="stylesheet" href="https://oosawak.github.io/html-player/assets/fonts.css">
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{width:100%;height:100%;object-fit:contain;background:#000;}
</style>
</head>
<body>
<canvas id="cv" width="512" height="512"></canvas>
<script src="https://oosawak.github.io/html-player/assets/hp.js?v=7"></script>
<script>
"use strict";
// CubeBoy — ダッシュと壁ジャンプの小さなプラットフォーマー（Pyxel版からの作り直し）
// 部屋を巡ってオーブを3つ集めるとボス出現。最初の部屋の中心の出口へ逃げ切ればクリア。
const W=128,H=128,TS=8;
const cv=document.getElementById("cv"),g=cv.getContext("2d");
// Pyxel default palette (subset)
const C_BG="#000000",C_WALL="#2B335F",C_WALLD="#5F574F",C_WHITE="#FFF1E8",
C_PINK="#FF77A8",C_CYAN="#29ADFF",C_GRAYC="#C2C3C7",C_YEL="#FFEC27",
C_RED="#FF004D",C_MTN1="#7E2553",C_MTN2="#5F574F",C_ROOM="#83769C";

function hashSeed(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function RNG(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function R(rng){return rng()}
function RI(rng,a,b){return a+Math.floor(rng()*(b-a+1))}
function RU(rng,a,b){return a+rng()*(b-a)}

// --- room generation (same rules as the original) ---
function genRoom(rx,ry){
  const rng=RNG(hashSeed(rx+"_"+ry+"_cubeboy"));
  const tm=new Array(256).fill(0);
  const T=(x,y)=>tm[y*16+x], S=(x,y,v)=>{tm[y*16+x]=v};
  for(let x=0;x<16;x++)for(let y=0;y<16;y++){
    const edge=(x===0||x===15||y===0||y===15);
    const exit=((x===7||x===8)&&(y===0||y===15))||((y===7||y===8)&&(x===0||x===15));
    if(edge&&!exit)S(x,y,1);
  }
  const density=RU(rng,0.7,0.9);
  for(let gy=1;gy<7;gy++)for(let gx=1;gx<7;gx++){
    if(R(rng)<density){
      const px=gx*2,py=gy*2,type=RI(rng,0,3),size=RI(rng,2,3);
      if(type===0){for(let i=0;i<size;i++)if(0<px+i&&px+i<15)S(px+i,py,1)}
      else if(type===1){for(let i=0;i<size;i++)if(0<py+i&&py+i<15)S(px,py+i,1)}
      else if(type===2){
        for(let i=0;i<size;i++)if(0<px+i&&px+i<15)S(px+i,py,1);
        for(let i=0;i<size;i++)if(0<py+i&&py+i<15)S(px,py+i,1);
      }else S(px,py,1);
    }
  }
  for(let i=7;i<9;i++){for(let j=0;j<2;j++)S(i,j,0);for(let j=14;j<16;j++)S(i,j,0)}
  for(let j=7;j<9;j++){for(let i=0;i<2;i++)S(i,j,0);for(let i=14;i<16;i++)S(i,j,0)}
  for(let i=6;i<10;i++)for(let j=6;j<10;j++)S(i,j,0);
  for(let i=11;i<15;i++)for(let j=1;j<4;j++)S(i,j,0);
  for(let n=0;n<15;n++){
    const tx=RI(rng,1,14),ty=RI(rng,1,14);
    if(tx===7||tx===8||ty===7||ty===8)continue;
    if(6<=tx&&tx<=9&&6<=ty&&ty<=9)continue;
    if(tx>=11&&ty<=3)continue;
    if(T(tx,ty)===0){
      let adj=false;
      for(const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){
        const ax=tx+dx,ay=ty+dy;
        if(0<=ax&&ax<16&&0<=ay&&ay<16&&T(ax,ay)===1){adj=true;break}
      }
      if(adj)S(tx,ty,2);
    }
  }
  return tm;
}
function roomOrbs(rx,ry,tm){
  if(rx===0&&ry===0)return [];
  if(collectedRooms.has(rx+","+ry))return [];
  if(roomsData.has(rx+","+ry))return roomsData.get(rx+","+ry);
  const rng=RNG(hashSeed(rx+"_"+ry+"_cubeboy_orb"));
  const T=(x,y)=>tm[y*16+x];
  let orbs=[];
  for(let t=0;t<20&&!orbs.length;t++){
    const ox=RI(rng,24,104),oy=RI(rng,24,104);
    const tx=(ox/8)|0,ty=(oy/8)|0;
    if(T(tx,ty)===0&&!(6<=tx&&tx<=9&&6<=ty&&ty<=9)){
      let near=false;
      for(let dx=-2;dx<3&&!near;dx++)for(let dy=-2;dy<3;dy++){
        const ax=tx+dx,ay=ty+dy;
        if(0<=ax&&ax<16&&0<=ay&&ay<16&&T(ax,ay)===1){near=true;break}
      }
      if(near)orbs=[{x:ox,y:oy,active:true,timer:0}];
    }
  }
  if(!orbs.length)orbs=[{x:64,y:64,active:true,timer:0}];
  roomsData.set(rx+","+ry,orbs);
  return orbs;
}

// --- player ---
function mkPlayer(x,y){
  return {x,y,vx:0,vy:0,w:6,h:6,onGround:false,onWall:0,canDash:true,
          dashTime:0,dashDir:[0,0],coyote:0,buf:0,sx:1,sy:1,facing:1,dead:false};
}
let tm=null;
function isWall(p,x,y){
  const x1=Math.floor(x/8),y1=Math.floor(y/8);
  const x2=Math.floor((x+p.w-0.1)/8),y2=Math.floor((y+p.h-0.1)/8);
  for(let ty=y1;ty<=y2;ty++){
    if(ty<0||ty>=16)continue;
    for(let tx=x1;tx<=x2;tx++){
      if(tx<0||tx>=16)continue;
      if(tm[ty*16+tx]===1)return true;
    }
  }
  return false;
}
function resolveOverlap(p){
  if(isWall(p,p.x,p.y)){
    for(let r=1;r<16;r++)
      for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
        if(!isWall(p,p.x+dx,p.y+dy)){p.x+=dx;p.y+=dy;return}
      }
  }
}
let tapA=false,tapB=false,tapNowA=false,tapNowB=false,prevUp=false;
let cbAEdge=false,cbBEdge=false,cbAPrev=false,cbBPrev=false;
cv.addEventListener("pointerdown",()=>{tapA=true});
function updPlayer(p,parts){
  resolveOverlap(p);
  if(p.coyote>0)p.coyote--;
  if(p.buf>0)p.buf--;
  const dxIn=(HP.right()?1:0)-(HP.left()?1:0);
  const dyIn=(HP.down()?1:0)-(HP.up()?1:0);
  if(p.dashTime>0){
    p.vx=p.dashDir[0]*5;p.vy=p.dashDir[1]*5;p.dashTime--;
    parts.push({x:p.x+3,y:p.y+3,dx:Math.random()*2-1,dy:Math.random()*2-1,col:C_CYAN,life:10});
    if(p.dashTime===0){p.vx*=0.5;p.vy*=0.5}
  }else{
    if(dxIn!==0){
      const target=dxIn*2.5;
      p.vx+=(target-p.vx)*0.2;
      p.facing=dxIn;
    }else p.vx*=0.7;
    if(p.onWall!==0&&p.vy>0)p.vy=clamp(p.vy+0.1,0,0.8);
    else{
      const grav=(HP.a()&&p.vy<0)?0.3:0.5;
      p.vy+=grav;
    }
    const upNow=HP.up();
    if(cbAEdge||tapNowA||(upNow&&!prevUp))p.buf=4;
    prevUp=upNow;
    if(p.buf>0){
      if(p.coyote>0){
        p.vy=-4.5;p.sx=0.6;p.sy=1.4;p.coyote=0;p.buf=0;
        HP.beep(523,0.05,"square",0.04);
      }else if(p.onWall!==0){
        p.vy=-4.2;p.vx=-p.onWall*3.5;p.sx=0.6;p.sy=1.4;p.buf=0;
        HP.beep(523,0.05,"square",0.04);
      }
    }
    if((cbBEdge||tapNowB)&&p.canDash){
      let idx=dxIn,idy=dyIn;
      if(idx===0&&idy===0)idx=p.facing;
      const mag=Math.hypot(idx,idy);
      p.dashDir=[idx/mag,idy/mag];
      p.dashTime=6;p.canDash=false;p.vy=0;
      dashShake=true;
      HP.beep(300,0.05,"sawtooth",0.04);
    }
  }
  const oldY=p.y;
  let stepsX=Math.floor(Math.abs(p.vx)/0.5)+1,stepX=p.vx/stepsX;
  for(let i=0;i<stepsX;i++){
    if(!isWall(p,p.x+stepX,p.y))p.x+=stepX;
    else{p.vx=0;break}
  }
  let stepsY=Math.floor(Math.abs(p.vy)/0.5)+1,stepY=p.vy/stepsY;
  for(let i=0;i<stepsY;i++){
    if(!isWall(p,p.x,p.y+stepY))p.y+=stepY;
    else{p.vy=0;break}
  }
  p.onGround=isWall(p,p.x,p.y+1);
  if(p.onGround){
    p.coyote=5;p.canDash=true;
    if(oldY<p.y){p.sx=1.4;p.sy=0.6}
  }
  if(isWall(p,p.x+1,p.y))p.onWall=1;
  else if(isWall(p,p.x-1,p.y))p.onWall=-1;
  else p.onWall=0;
  p.sx+=(1-p.sx)*0.2;p.sy+=(1-p.sy)*0.2;
  const ctx_=Math.floor((p.x+3)/8),cty=Math.floor((p.y+3)/8);
  if(0<=ctx_&&ctx_<16&&0<=cty&&cty<16&&tm[cty*16+ctx_]===2)p.dead=true;
}
function drawPlayer(p,frame){
  const sw=8*p.sx;let sh=8*p.sy;
  if(p.onGround&&Math.abs(p.vx)<0.2)sh+=Math.sin(frame*15*Math.PI/180)*0.4;
  g.fillStyle=p.canDash?C_WHITE:C_PINK;
  g.fillRect(p.x+(p.w-sw)/2,p.y+(p.h-sh),sw,sh);
  g.fillStyle="#000";
  g.fillRect(p.x+(p.facing>0?4:0),p.y+1,1,1);
}

// --- boss ---
function mkBoss(){return {x:-100,y:-100,w:24,h:24,speed:0.8,spawned:false}}
function updBoss(b,p){
  const dx=(p.x+3)-(b.x+b.w/2),dy=(p.y+3)-(b.y+b.h/2),dist=Math.hypot(dx,dy);
  if(dist>0){b.x+=dx/dist*b.speed;b.y+=dy/dist*b.speed}
  const tx0=Math.floor(b.x/8),ty0=Math.floor(b.y/8);
  const tx1=Math.floor((b.x+b.w)/8),ty1=Math.floor((b.y+b.h)/8);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    if(0<=tx&&tx<16&&0<=ty&&ty<16&&tm[ty*16+tx]===1)tm[ty*16+tx]=0;
  }
}
function drawBoss(b){
  g.fillStyle=C_RED;g.fillRect(b.x,b.y,b.w,b.h);
  g.strokeStyle=C_WHITE;g.strokeRect(b.x+0.5,b.y+0.5,b.w-1,b.h-1);
  g.fillStyle=C_WHITE;
  g.fillRect(b.x+4,b.y+6,4,4);g.fillRect(b.x+16,b.y+6,4,4);
}

// --- game state ---
let state="title",roomX=0,roomY=0,player=null,boss=null,parts=[];
let orbs=[],roomsData=new Map(),collectedRooms=new Set(),collected=0;
let countdown=0,deathTimer=0,shake=0,dashShake=false,frame=0;
function enterRoom(){
  tm=genRoom(roomX,roomY);
  orbs=roomOrbs(roomX,roomY,tm);
  parts=[];
}
function resetGame(){
  roomX=0;roomY=0;roomsData=new Map();collectedRooms=new Set();collected=0;
  countdown=0;deathTimer=0;shake=0;parts=[];
  player=mkPlayer(64,64);boss=mkBoss();
  go("play");
  enterRoom();
}
function drawBG(){
  g.fillStyle=C_BG;g.fillRect(0,0,W,H);
  g.fillStyle=C_WHITE;g.beginPath();g.arc(105,15,6,0,7);g.fill();
  g.fillStyle=C_BG;g.beginPath();g.arc(103,13,5,0,7);g.fill();
  const cols=[C_MTN1,C_MTN2,C_MTN1],hs=[15,28,45];
  for(let layer=0;layer<3;layer++){
    const rng=RNG(hashSeed(roomX+"_"+roomY+"_mtn_"+layer));
    const hMax=hs[layer];g.fillStyle=cols[layer];
    let lastH=RI(rng,hMax-10,hMax+10);
    for(let x=0;x<W+32;x+=32){
      const nextH=RI(rng,hMax-10,hMax+10);
      for(let i=0;i<32;i++){
        const t=i/32,st=t*t*(3-2*t);
        const h=Math.round(lastH*(1-st)+nextH*st);
        g.fillRect(x+i,H-h,1,h+10);
      }
      lastH=nextH;
    }
  }
}
function drawTiles(){
  for(let ty=0;ty<16;ty++)for(let tx=0;tx<16;tx++){
    const v=tm[ty*16+tx],x=tx*8,y=ty*8;
    if(v===1){
      g.fillStyle=C_WALL;g.fillRect(x,y,8,8);
      g.fillStyle=C_WALLD;g.fillRect(x+2,y+2,1,1);
    }else if(v===2){
      g.fillStyle=C_CYAN;
      tri(x+0,y+7,x+2,y+2,x+4,y+7);
      g.fillStyle=C_GRAYC;
      tri(x+3,y+7,x+5,y+1,x+7,y+7);
      g.fillStyle=C_CYAN;
      tri(x+5,y+7,x+6,y+3,x+7,y+7);
      g.strokeStyle=C_WHITE;g.beginPath();
      g.moveTo(x+2,y+3);g.lineTo(x+2,y+7);
      g.moveTo(x+5,y+2);g.lineTo(x+5,y+7);
      g.stroke();
    }
  }
}
function tri(x1,y1,x2,y2,x3,y3){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineTo(x3,y3);g.closePath();g.fill()}
function drawOrb(o){
  if(o.active){
    const off=Math.sin(((frame>>2)*20)*Math.PI/180)*2;
    g.fillStyle=C_YEL;g.beginPath();g.arc(o.x+4,o.y+4+off,3,0,7);g.fill();
    g.strokeStyle=C_WHITE;g.beginPath();g.arc(o.x+4,o.y+4+off,3,0,7);g.stroke();
  }else{
    g.strokeStyle=C_WALLD;g.beginPath();g.arc(o.x+4,o.y+4,2,0,7);g.stroke();
  }
}
function drawHUD(){
  g.font="5px monospace";g.textAlign="left";
  g.fillStyle=collected<3?C_WHITE:C_YEL;
  g.fillText("ORBS: "+collected+"/3",4,9);
  g.fillStyle=C_ROOM;
  g.fillText("ROOM: "+roomX+","+roomY,4,17);
  if(state==="boss"){
    if(countdown>0){
      const sec=Math.floor(countdown/30);
      g.fillStyle=C_RED;g.font="5px monospace";
      g.fillText("BOSS IN: "+sec+"s",80,121);
      g.fillRect(80,124,40*(countdown/300),2);
    }else{
      g.fillStyle=C_RED;g.fillText("WARNING: BOSS ACTIVE!",62,125);
    }
  }
}
function drawScene(){
  g.setTransform(4,0,0,4,0,0);
  let ox=0,oy=0;
  if(shake>0){ox=Math.random()*shake*2-shake;oy=Math.random()*shake*2-shake}
  g.translate(ox,oy);
  drawBG();drawTiles();
  if(state==="boss"&&roomX===0&&roomY===0){
    const r=8+Math.sin(frame*10*Math.PI/180)*2;
    g.fillStyle="#00E436";g.beginPath();g.arc(64,64,r,0,7);g.fill();
    g.fillStyle=C_WHITE;g.beginPath();g.arc(64,64,4,0,7);g.fill();
    g.font="5px monospace";g.fillStyle=C_WHITE;g.textAlign="center";
    g.fillText("EXIT",64,54);g.textAlign="left";
  }
  for(const o of orbs)drawOrb(o);
  for(const p of parts){g.fillStyle=p.col;g.fillRect(p.x,p.y,1,1)}
  if(player&&!player.dead)drawPlayer(player,frame);
  if(boss&&boss.spawned&&(state==="boss"||state==="overseq"))drawBoss(boss);
  g.setTransform(4,0,0,4,0,0);
  drawHUD();
}
function drawTitle(){
  g.setTransform(4,0,0,4,0,0);
  g.fillStyle=C_BG;g.fillRect(0,0,W,H);
  g.fillStyle=C_WHITE;g.beginPath();g.arc(105,15,6,0,7);g.fill();
  g.fillStyle=C_BG;g.beginPath();g.arc(103,13,5,0,7);g.fill();
  g.fillStyle=C_WHITE;g.fillRect(58,44,12,12);
  g.fillStyle="#000";g.fillRect(66,46,1,1);
  g.font="700 13px \"HP Sans\",sans-serif";g.textAlign="center";
  g.fillStyle=C_WHITE;g.fillText("CubeBoy",64,76);
  g.font="6px \"HP Sans\",sans-serif";g.fillStyle=C_YEL;
  if(((frame/30)|0)%2===0)g.fillText("Aボタンでスタート",64,90);
  g.fillStyle=C_GRAYC;
  g.fillText("オーブを3つ集めるとボス出現",64,104);
  g.fillText("最初の部屋の出口へ逃げ切れ",64,112);
  g.fillText("移動:←→↑↓ / ジャンプ:A / ダッシュ:B",64,120);
  g.textAlign="left";
  g.setTransform(1,0,0,1,0,0);
}
function burst(x,y,col,n,pow){
  for(let i=0;i<n;i++)parts.push({x,y,dx:Math.random()*pow*2-pow,dy:Math.random()*pow*2-pow,col,life:20});
}
function stepTitle(){
    drawTitle();
    if(HP.a()||cbAEdge||tapNowA)resetGame();
    return;
}
function stepEnd(){
    drawScene();
    g.setTransform(4,0,0,4,0,0);
    g.font="700 11px \"HP Sans\",sans-serif";g.textAlign="center";
    if(state==="over"){
      g.fillStyle=C_RED;g.fillText("GAME OVER",64,60);
      g.font="6px \"HP Sans\",sans-serif";g.fillStyle=C_WHITE;
      g.fillText("Aボタンでもう一度",64,74);
    }else{
      g.fillStyle=C_YEL;g.fillText("GAME CLEAR!",64,60);
      g.font="6px \"HP Sans\",sans-serif";g.fillStyle=C_WHITE;
      g.fillText("CONGRATULATIONS!",64,72);
      g.fillText("Aボタンでもう一度",64,82);
    }
    g.textAlign="left";g.setTransform(1,0,0,1,0,0);
    if(HP.a()||cbAEdge||tapNowA)resetGame();
    return;
}
function stepSeq(){
    deathTimer--;shake=5;
    boss&&boss.spawned&&updBoss(boss,player);
    burst(player.x+2+Math.random()*4,player.y+2+Math.random()*4,
      [C_WHITE,C_CYAN,"#00BFFF"][(Math.random()*3)|0],3,2);
    for(const p of parts){p.x+=p.dx;p.y+=p.dy;p.life--}
    parts=parts.filter(p=>p.life>0);
    if(deathTimer<=0){go("over");shake=0}
    drawScene();
    return;
}
function stepMain(){
  // play / boss
  dashShake=false;
  updPlayer(player,parts);
  if(dashShake)shake=4;
  if(player.dead){
    if(state==="boss"&&boss.spawned){
      // handled below via boss collision; spike death in boss state also respawns
    }
    shake=10;
    HP.beep(140,0.15,"sawtooth",0.05);
    burst(player.x+4,player.y+4,C_CYAN,15,3);
    player.x=64;player.y=64;player.vx=0;player.vy=0;player.dead=false;
  }
  if(state==="boss"&&roomX===0&&roomY===0){
    if(Math.abs(player.x-64)<8&&Math.abs(player.y-64)<8){go("clear");drawScene();return}
  }
  if(state==="boss"){
    if(countdown>0){
      countdown--;
      if(countdown===0){boss.x=player.x-64;boss.y=player.y-64;boss.spawned=true}
    }else if(boss.spawned){
      updBoss(boss,player);
      if(player.x<boss.x+boss.w&&player.x+player.w>boss.x&&
         player.y<boss.y+boss.h&&player.y+player.h>boss.y){
        player.dead=true;shake=15;go("overseq");deathTimer=150;
        HP.beep(140,0.25,"sawtooth",0.05);
        burst(player.x+2,player.y+2,C_WHITE,40,4);
        drawScene();return;
      }
    }
  }
  // room transitions
  const m=4;let changed=false;
  if(player.x<-m){roomX--;player.x=W-player.w-12;if(boss)boss.x+=W;changed=true}
  else if(player.x>W-player.w+m){roomX++;player.x=12;if(boss)boss.x-=W;changed=true}
  if(player.y<-m){roomY--;player.y=H-player.h-12;if(boss)boss.y+=H;changed=true}
  else if(player.y>H+m){roomY++;player.y=12;if(boss)boss.y-=H;changed=true}
  if(changed)enterRoom();
  if(shake>0)shake--;
  for(const o of orbs){
    if(!o.active){
      o.timer++;
      if(o.timer>90){o.active=true;o.timer=0}
    }else{
      const dx=(player.x+3)-(o.x+4),dy=(player.y+3)-(o.y+4);
      if(Math.hypot(dx,dy)<10&&!player.canDash){
        player.canDash=true;o.active=false;o.timer=0;
        collected++;
        collectedRooms.add(roomX+","+roomY);
        HP.beep(880,0.06,"square",0.04);
        burst(o.x+4,o.y+4,C_YEL,5,2);
        shake=Math.max(shake,2);
        if(collected>=3&&state==="play"){go("boss");countdown=300}
      }
    }
  }
  for(const p of parts){p.x+=p.dx;p.y+=p.dy;p.life--}
  parts=parts.filter(p=>p.life>0);
  drawScene();
}
const SC=HP.scene({title:{frame:stepTitle},main:{frame:stepMain},overseq:{frame:stepSeq},over:{frame:stepEnd},clear:{frame:stepEnd}},"title");
function go(name){state=name;SC.go(name==="boss"||name==="play"?"main":name)}
function step(){
  frame++;
  tapNowA=tapA;tapNowB=tapB;tapA=false;tapB=false;
  const haNow=HP.a(),hbNow=HP.b();
  cbAEdge=haNow&&!cbAPrev;cbAPrev=haNow;
  cbBEdge=hbNow&&!cbBPrev;cbBPrev=hbNow;
  SC.frame();
}
// fixed-step loop (30Hz, same feel as the original)
player=mkPlayer(64,64);boss=mkBoss();tm=genRoom(0,0);
let acc=0;
HP.loop(function(dt){
  acc+=dt;
  const h=1/30;let n=0;
  while(acc>=h&&n<4){step();acc-=h;n++}
  if(n===4)acc=0;
});
</script>

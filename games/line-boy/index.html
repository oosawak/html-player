<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src https://oosawak.github.io 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<title>LINE BOY</title>
<link rel="stylesheet" href="https://oosawak.github.io/html-player/assets/fonts.css">
<style>
  html,body{margin:0;padding:0;background:#050508;height:100%;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{width:100%;height:100%;object-fit:contain;background:#050508;}

<body>
<canvas id="cv" width="512" height="512"></canvas>
<script src="https://oosawak.github.io/html-player/assets/hp.js?v=4"></script>
<script>
"use strict";
// LINE BOY — ネオンな線画プラットフォーマー（Pyxel版からの作り直し）
// 全5ワールド。各ワールドの奥にいるボスを倒してゴールへ。
const W=512,H=512,LEVEL_W=W*4,TS=16,PW=12,PH=14;
const GRAV=0.55,JUMP_VEL=-9.5,MAX_FALL=12,MOVE_SPEED=3.2,FRICTION=0.80;
const PAL=["#050508","#0D1B4B","#BF00FF","#39FF14","#A0522D","#1A3A5C","#00BFFF","#F0F0FF",
"#FF2020","#FF6B00","#FFFF00","#CCFF00","#00F5FF","#404050","#FF1493","#FF7F50"];
const CB=0,CPU=2,CG=3,CBR=4,CLB=6,CW=7,CR=8,CO=9,CY=10,CL=11,CC=12,CGR=13,CP=14,CPE=15;
const THEMES=[
 {name:"FOREST", ground:CG, accent:CBR, sky:CL},
 {name:"DESERT", ground:CO, accent:CY, sky:CPE},
 {name:"CAVE",   ground:CC, accent:CGR, sky:CLB},
 {name:"GHOST",  ground:CPU,accent:CP, sky:CW},
 {name:"VOLCANO",ground:CR, accent:CO, sky:CP}];
const cv=document.getElementById("cv"),g=cv.getContext("2d");

// seeded RNG (mulberry32)
function RNG(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(rng,a,b){return a+rng()*(b-a)}          // float a..b
function ri(rng,a,b){return a+Math.floor(rng()*(b-a+1))} // int a..b inclusive
function clamp(v,a,b){return v<a?a:(v>b?b:v)}

// --- neon drawing helpers ---
function nLine(x1,y1,x2,y2,core,glow){
  g.strokeStyle=PAL[glow==null?core:glow];g.lineWidth=1;
  if(glow===undefined||glow!==null){g.beginPath();g.moveTo(x1-1,y1);g.lineTo(x2-1,y2);g.stroke();
  g.beginPath();g.moveTo(x1+1,y1);g.lineTo(x2+1,y2);g.stroke();
  g.beginPath();g.moveTo(x1,y1-1);g.lineTo(x2,y2-1);g.stroke();
  g.beginPath();g.moveTo(x1,y1+1);g.lineTo(x2,y2+1);g.stroke();}
  g.strokeStyle=PAL[core];g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
}
function nRectb(x,y,w,h,core,glow){
  if(glow!=null){g.strokeStyle=PAL[glow];g.strokeRect(x-1,y-1,w+2,h+2);}
  g.strokeStyle=PAL[core];g.strokeRect(x,y,w,h);
}
function nCircb(x,y,r,core,glow){
  if(glow!=null){g.strokeStyle=PAL[glow];g.beginPath();g.arc(x,y,r+1,0,7);g.stroke();}
  g.strokeStyle=PAL[core];g.beginPath();g.arc(x,y,r,0,7);g.stroke();
}
function pset(x,y,c){g.fillStyle=PAL[c];g.fillRect(x|0,y|0,1,1)}
function rect(x,y,w,h,c){g.fillStyle=PAL[c];g.fillRect(x,y,w,h)}
function text(s,x,y,size,col,align,font){
  g.font=size+"px "+(font||'"HP Sans",sans-serif');
  g.fillStyle=PAL[col];g.textAlign=align||"left";g.fillText(s,x,y);g.textAlign="left";
}
function spiral(cx,cy,maxR,col,tOff){
  const step=4;let d=tOff%4,len=2,drawn=0,px=cx,py=cy;
  const dirs=[[step,0],[0,step],[-step,0],[0,-step]];
  g.strokeStyle=PAL[col];g.lineWidth=1;g.beginPath();
  while(drawn<maxR*2){
    const dx=dirs[d%4][0],dy=dirs[d%4][1];
    let nx=clamp(px+dx*len,cx-maxR,cx+maxR),ny=clamp(py+dy*len,cy-maxR,cy+maxR);
    g.moveTo(px,py);g.lineTo(nx,ny);px=nx;py=ny;d++;len++;drawn+=len;
    if(drawn>maxR*6)break;
  }
  g.stroke();
}
function dashLine(x1,y1,x2,y2,col){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);if(!len)return;
  g.strokeStyle=PAL[col];g.beginPath();
  for(let i=0;i<len;i+=6){
    const t1=i/len,t2=Math.min((i+3)/len,1);
    g.moveTo(x1+dx*t1,y1+dy*t1);g.lineTo(x1+dx*t2,y1+dy*t2);
  }
  g.stroke();
}
function tree(x,y,h,cTrunk,cLeaf,style){
  const tw=6,th=(h/3)|0;
  g.strokeStyle=PAL[cTrunk];g.strokeRect(x-tw/2,y-th,tw,th);
  if(style===0){
    const r=(h/3)|0;
    nCircb(x,y-th-r+2,r,cLeaf);nCircb(x-(r/2|0),y-th-(r/2|0),r-4,cLeaf);nCircb(x+(r/2|0),y-th-(r/2|0),r-4,cLeaf);
  }else if(style===1){
    const ch=th*2;
    g.strokeRect(x-3,y-ch,6,ch);g.strokeRect(x-10,y-(ch/2|0)-4,7,6);g.strokeRect(x+3,y-(ch/2|0)-4,7,6);
  }else{
    g.strokeRect(x-3,y-th*3,6,th*3);
    g.strokeStyle=PAL[cLeaf];g.beginPath();
    for(let yy=0;yy<th*3;yy+=6){
      g.moveTo(x-3,y-th*3+yy);g.lineTo(x-8,y-th*3+yy+3);
      g.moveTo(x+3,y-th*3+yy);g.lineTo(x+8,y-th*3+yy+3);
    }
    g.stroke();
  }
}

// --- terrain generation (same rules as the original) ---
function genTerrain(seed,themeIdx){
  const rng=RNG(seed),theme=THEMES[themeIdx];
  let groundY=H-80;const segs=[],plats=[],trees=[],enemies=[],items=[];
  let x=0;
  while(x<LEVEL_W){
    const sw=ri(rng,TS*2,TS*8),dy=ri(rng,-TS,TS);
    groundY=clamp(groundY+dy,H-140,H-60);
    segs.push([x,groundY,sw]);x+=sw;
  }
  const np=(LEVEL_W/(TS*8))|0;
  for(let i=0;i<np;i++)plats.push([ri(rng,TS*2,LEVEL_W-TS*6),ri(rng,H-260,H-120),ri(rng,TS*3,TS*8)]);
  for(let i=0;i<segs.length;i+=3){
    const s=segs[i];
    trees.push([s[0]+ri(rng,4,Math.max(5,s[2]-4)),s[1],ri(rng,32,64),theme.accent,theme.ground,ri(rng,0,2)]);
  }
  const ne=(LEVEL_W/(TS*16))|0;
  for(let i=0;i<ne;i++){
    const ex=ri(rng,TS*4,LEVEL_W-TS*4);let ey=H-80;
    for(const s of segs){if(s[0]<=ex&&ex<=s[0]+s[2]){ey=s[1];break}}
    enemies.push([ex,ey]);
  }
  for(let i=0;i<segs.length;i+=2){
    const s=segs[i],n=ri(rng,1,4);
    for(let j=0;j<n;j++)items.push([s[0]+ri(rng,4,Math.max(5,s[2]-4)),s[1]-10]);
  }
  return {segs,plats,trees,enemies,items};
}

// --- entities ---
function mkParticle(x,y,vx,vy,col,life,shape,grav){
  return {x,y,ox:x,oy:y,vx,vy,col,life,lifeMax:life,shape,grav:grav==null?0.15:grav};
}
function updParticle(p){p.ox=p.x;p.oy=p.y;p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=0.96;p.life--}
function drawParticle(p,camX){
  const a=p.life/p.lifeMax;if(a<=0)return;
  const sx=(p.x-camX)|0,sy=p.y|0,col=a>0.4?p.col:CGR;
  if(p.shape===0)pset(sx,sy,col);
  else if(p.shape===1){const s=Math.max(1,(a*3)|0);g.strokeStyle=PAL[col];g.strokeRect(sx-s,sy-s,s*2+1,s*2+1)}
  else{nLine(p.ox-camX,p.oy,sx,sy,col,null);if(p.shape===3)pset(sx,sy,CW)}
}
function mkEnemy(x,y,col){return {x,y,col,vx:Math.random()<0.5?-1:1,alive:true,anim:0}}
function updEnemy(e,segs,plats){
  e.x+=e.vx;e.anim++;
  for(const s of segs){
    if(s[0]<=e.x&&e.x<=s[0]+s[2]&&Math.abs(e.y-s[1])<2){
      if(e.x<=s[0]+4||e.x>=s[0]+s[2]-4)e.vx*=-1;break;
    }
  }
  for(const p of plats){
    if(p[0]<=e.x&&e.x<=p[0]+p[2]&&Math.abs(e.y-p[1])<2){
      if(e.x<=p[0]+4||e.x>=p[0]+p[2]-4)e.vx*=-1;break;
    }
  }
}
function drawEnemy(e,camX){
  const S=10,sx=(e.x-camX)|0,sy=(e.y-S+Math.sin(e.anim*0.2)*2)|0;
  nRectb(sx-(S/2|0),sy,S,S,e.col,CB);
  const ex=e.vx>0?sx-2:sx+2;
  pset(ex,sy+3,CW);pset(sx,sy+3,CW);
  const leg=((e.anim*0.3)|0)%4;
  nLine(sx-3,sy+S,sx-3+leg,sy+S+4,e.col,null);
  nLine(sx+3,sy+S,sx+3-leg,sy+S+4,e.col,null);
}
function mkBoss(x,y,col){return {x,y,col,hp:5,vx:1.5,alive:true,flash:0,size:40,timer:0}}
function updBoss(b,p){
  b.timer++;
  const dx=(p.x+PW/2)-b.x,dy=(p.y+PH/2)-b.y,dist=Math.hypot(dx,dy);
  if(dist>0){const sp=1.2+b.timer*0.001;b.x+=dx/dist*sp;b.y+=dy/dist*sp}
  if(b.flash>0)b.flash--;
}
function drawBoss(b,camX){
  const sx=(b.x-camX)|0,sy=b.y|0,r=b.size;
  const col=(b.flash%2===1)?CW:b.col;
  nCircb(sx,sy,r+6,CGR);nCircb(sx,sy,r+4,(b.flash%2===0)?CB:col);
  nCircb(sx,sy,r,col,CGR);
  nLine(sx-r+4,sy,sx+r-4,sy,col,null);nLine(sx,sy-r+4,sx,sy+r-4,col,null);
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2+b.timer*0.05;
    g.strokeStyle=PAL[col];
    g.strokeRect(sx+Math.cos(a)*(r-8)-4,sy+Math.sin(a)*(r-8)-4,8,8);
  }
  for(let i=0;i<6;i++){
    const a2=i/6*Math.PI*2-b.timer*0.08;
    pset(sx+Math.cos(a2)*(r-20),sy+Math.sin(a2)*(r-20),CW);
  }
}

// --- player ---
function mkPlayer(x,y){
  return {x,y,vx:0,vy:0,onGround:false,facing:1,alive:true,inv:0,score:0,
          sx:1,sy:1,coyote:0,buf:0,anim:0};
}
let tapA=false,tapNow=false;
cv.addEventListener("pointerdown",()=>{tapA=true});
function aHit(){return HP.aHit()||tapNow}
function aHeld(){return HP.a()||tapNow}

function playerDie(p,parts,col){
  p.alive=false;const cx=p.x+PW/2,cy=p.y+PH/2;
  for(let i=0;i<20;i++)parts.push(mkParticle(cx,cy,rr(Math.random,-5,5),rr(Math.random,-6,1),col,45,3,0.18));
  for(let i=0;i<12;i++)parts.push(mkParticle(cx,cy,rr(Math.random,-3,3),rr(Math.random,-4,0.5),CW,30,2,0.1));
  for(let i=0;i<8;i++)parts.push(mkParticle(cx,cy,rr(Math.random,-2,2),rr(Math.random,-3,0),CY,25,1,0.08));
  HP.beep(110,0.25,"sawtooth",0.05);
}
function updPlayer(p,lv,enemies,items,boss,parts,col){
  if(!p.alive)return;
  p.anim++;
  if(p.inv>0)p.inv--;
  if(p.coyote>0)p.coyote--;
  if(p.buf>0)p.buf--;
  const left=HP.left(),right=HP.right();
  if(left){p.vx-=1.2;p.facing=-1}
  else if(right){p.vx+=1.2;p.facing=1}
  else p.vx*=FRICTION;
  p.vx=clamp(p.vx,-MOVE_SPEED,MOVE_SPEED);
  const grav=GRAV*(aHeld()&&p.vy<0?0.55:1.0);
  p.vy=Math.min(p.vy+grav,MAX_FALL);
  if(aHit())p.buf=5;
  if(p.buf>0&&p.coyote>0){
    p.vy=JUMP_VEL;p.coyote=0;p.buf=0;p.sx=0.6;p.sy=1.5;
    HP.beep(440,0.07,"square",0.04);
    for(let i=0;i<10;i++)parts.push(mkParticle(p.x+PW/2,p.y+PH,rr(Math.random,-2.5,2.5),rr(Math.random,0.5,2.5),col,18,2,0.1));
  }
  p.x+=p.vx;
  p.x=Math.max(0,Math.min(p.x,LEVEL_W-PW));
  p.y+=p.vy;
  const wasGround=p.onGround;p.onGround=false;
  // landing resolution (same approach as the original: centre-x, highest surface)
  const foot=p.y+PH,cx=p.x+PW/2,cands=[];
  for(const s of lv.segs)if(s[0]-2<=cx&&cx<=s[0]+s[2]+2)cands.push(s[1]);
  for(const pl of lv.plats)if(pl[0]-2<=cx&&cx<=pl[0]+pl[2]+2&&p.vy>=0&&foot<=pl[1]+18)cands.push(pl[1]);
  if(cands.length&&p.vy>=0){
    let best=null;
    for(const sy of cands)if(foot>=sy-2&&(best===null||sy<best))best=sy;
    if(best!==null){p.y=best-PH;p.vy=0;p.onGround=true}
  }
  if(p.onGround&&!wasGround){
    p.sx=1.4;p.sy=0.6;
    for(let i=0;i<8;i++)parts.push(mkParticle(p.x+PW/2+rr(Math.random,-4,4),p.y+PH,rr(Math.random,-2,2),rr(Math.random,-1,0.2),col,14,1,0.05));
  }
  if(p.onGround){
    p.coyote=6;
    if(Math.abs(p.vx)>2.0&&p.anim%8===0)
      parts.push(mkParticle(p.x+PW/2,p.y+PH,-p.vx*0.4+rr(Math.random,-0.5,0.5),rr(Math.random,-1.5,-0.2),col,10,3,0.12));
  }
  p.sx+=(1-p.sx)*0.25;p.sy+=(1-p.sy)*0.25;
  if(p.y>H+50){playerDie(p,parts,col);return}
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(Math.abs(p.x+PW/2-it[0])<12&&Math.abs(p.y+PH/2-it[1])<12){
      items.splice(i,1);p.score+=10;
      for(let j=0;j<5;j++)parts.push(mkParticle(it[0],it[1],rr(Math.random,-2,2),rr(Math.random,-3,0),CY,20,0));
      HP.beep(880,0.05,"square",0.04);setTimeout(()=>HP.beep(1320,0.06,"square",0.04),40);
    }
  }
  if(p.inv===0){
    for(const e of enemies){
      if(!e.alive)continue;
      if(Math.abs(p.x+PW/2-e.x)<14&&Math.abs(p.y+PH/2-e.y)<14){
        if(p.vy>1&&p.y+PH<e.y+2){
          e.alive=false;p.vy=-6;p.score+=100;
          for(let j=0;j<8;j++)parts.push(mkParticle(e.x,e.y,rr(Math.random,-3,3),rr(Math.random,-4,0),col,25,0));
          HP.beep(160,0.08,"sawtooth",0.05);
        }else{playerDie(p,parts,col);return}
      }
    }
    if(boss&&boss.alive){
      const dx=Math.abs(p.x+PW/2-boss.x),dy=Math.abs(p.y+PH/2-boss.y);
      if(dx<boss.size*0.6&&dy<boss.size*0.6){
        if(p.vy>1){
          boss.hp--;boss.flash=8;p.vy=-8;
          for(let j=0;j<12;j++)parts.push(mkParticle(boss.x,boss.y,rr(Math.random,-4,4),rr(Math.random,-5,0),boss.col,30,0));
          HP.beep(160,0.08,"sawtooth",0.05);
          if(boss.hp<=0)boss.alive=false;
        }else{playerDie(p,parts,col);return}
      }
    }
  }
}
function drawPlayer(p,camX,col){
  if(!p.alive)return;
  if(p.inv>0&&((p.inv/4)|0)%2===1)return;
  const sx=(p.x-camX)|0;let sy=p.y|0;
  const sw=(PW*p.sx)|0,sh=(PH*p.sy)|0,ox=((PW-sw)/2)|0,oy=PH-sh;
  nRectb(sx+ox,sy+oy,sw,sh,col,CGR);
  pset(sx+(p.facing>0?PW-4:2),sy+oy+3,CW);
  if(p.onGround&&Math.abs(p.vx)<0.3)sy+=Math.round(Math.sin(p.anim*0.15)*1.5);
  if(!p.onGround){
    nLine(sx+2,sy+PH,sx+2+p.facing*3,sy+PH+5,col,null);
    nLine(sx+PW-3,sy+PH,sx+PW-3-p.facing*3,sy+PH+5,col,null);
  }else{
    const leg=((p.anim*0.35)|0)%4;
    nLine(sx+3,sy+sh+oy,sx+3+leg,sy+sh+oy+5,col,null);
    nLine(sx+sw-4,sy+sh+oy,sx+sw-4-leg,sy+sh+oy+5,col,null);
  }
}

// --- game state ---
let state="title",world=0,level=null,player=null,boss=null,parts=[];
let camX=0,shake=0,bossOn=false,overTimer=0,scoreTotal=0,frame=0,titlePts=[];
function startLevel(){
  const seed=world*9999+42;
  const data=genTerrain(seed,world);
  level={data,goalX:LEVEL_W-80,enemies:data.enemies.map(e=>mkEnemy(e[0],e[1],THEMES[world].accent)),items:data.items.slice()};
  const startY=level.data.segs.length?level.data.segs[0][1]:H-160;
  player=mkPlayer(60,startY-PH-2);
  boss=mkBoss(LEVEL_W-200,startY-80,THEMES[world].ground);
  parts=[];camX=0;shake=0;bossOn=false;overTimer=0;
}
function drawBG(){
  const theme=THEMES[world];rect(0,0,W,H,CB);
  const seed=world*9999+42;
  let rng=RNG(seed+777);
  for(let i=0;i<6;i++){
    const sx=rng()*LEVEL_W,sy=ri(rng,30,H-220),r=ri(rng,8,18);
    const scx=((sx-camX*0.25)%(W+60)+W+60)%(W+60)-30;
    spiral(scx,sy,r,theme.sky,((frame/30)|0)%4);
  }
  rng=RNG(seed+333);
  for(let i=0;i<8;i++){
    const lx=rng()*LEVEL_W,ly=ri(rng,15,(H/3)|0),ln=ri(rng,20,60);
    const lsx=((lx-camX*0.15)%(W+80)+W+80)%(W+80)-40;
    dashLine(lsx,ly,lsx+ln,ly,theme.sky);
  }
  rng=RNG(seed+999);
  for(let i=0;i<20;i++){
    const px2=rng()*LEVEL_W,py2=ri(rng,30,H-200);
    const spx=((px2-camX*0.18+frame*0.2)%(W+40)+W+40)%(W+40)-20;
    g.strokeStyle=PAL[theme.sky];g.strokeRect(spx,py2,3,3);
  }
}
function drawTerrain(){
  const theme=THEMES[world],col=theme.ground,acc=theme.accent,d=level.data;
  for(const t of d.trees){
    const sx=(t[0]-camX)|0;
    if(-80<sx&&sx<W+80)tree(sx,t[1],t[2],t[3],t[4],t[5]);
  }
  for(const p of d.plats){
    const sx=(p[0]-camX)|0;
    if(sx+p[2]<0||sx>W)continue;
    g.strokeStyle=PAL[col];g.beginPath();
    for(let i=0;i<p[2];i+=TS/2){
      const tooth=((i/(TS/2))|0)%2===0?4:2;
      g.moveTo(sx+i,p[1]);g.lineTo(sx+i+TS/2,p[1]);pset(sx+i,p[1]-tooth,col);
    }
    g.stroke();
    nLine(sx,p[1]+4,sx+p[2],p[1]+4,acc,null);
  }
  for(const s of d.segs){
    const sx=(s[0]-camX)|0;
    if(sx+s[2]<0||sx>W)continue;
    g.strokeStyle=PAL[col];g.beginPath();
    for(let i=0;i<s[2];i+=TS/2){
      const tooth=((i/(TS/2))|0)%2===0?5:3;
      g.moveTo(sx+i,s[1]);g.lineTo(sx+Math.min(i+TS/2,s[2]),s[1]);
      if(i+TS/4<s[2])pset(sx+i+TS/4,s[1]-tooth,col);
    }
    g.stroke();
    nLine(sx,Math.min(s[1]+8,H-2),sx+s[2],Math.min(s[1]+8,H-2),acc,null);
  }
  for(const it of level.items){
    const sx=(it[0]-camX)|0;
    if(-10<sx&&sx<W+10){
      const bob=Math.round(Math.sin(frame*0.12+it[0]*0.05)*2);
      g.strokeStyle=PAL[CY];g.strokeRect(sx-3,it[1]+bob-3,6,6);
      pset(sx,it[1]+bob,CW);
    }
  }
  const gx=(level.goalX-camX)|0;
  if(-20<gx&&gx<W+20){
    nLine(gx,H-180,gx,H-100,CW,null);
    g.strokeStyle=PAL[CY];g.strokeRect(gx,H-180,30,16);
    text("GO",gx+4,H-166,11,CY);
  }
}
function drawHUD(){
  const theme=THEMES[world];
  text("スコア:"+player.score,6,18,13,theme.ground);
  const name=theme.name;
  g.font="13px \"HP Sans\",sans-serif";
  text(name,W-g.measureText(name).width-6,18,13,theme.ground);
  text("WORLD "+(world+1),6,36,11,CGR);
  if(boss&&boss.alive&&bossOn){
    const bw=160,bx=W/2-bw/2,by=34;
    text("BOSS",W/2,by-4,12,CR,"center");
    nRectb(bx,by,bw,10,CR);
    rect(bx+1,by+1,Math.max(0,(bw-2)*boss.hp/5),8,CR);
  }
}
function drawTitle(){
  rect(0,0,W,H,CB);
  for(const p of titlePts)drawParticle(p,0);
  const sp=[[80,100,30,CG],[80,230,20,CL],[W-80,120,24,CO],[W-120,280,20,CC],[W/2+60,160,18,CPU]];
  sp.forEach((s,i)=>spiral(s[0]+Math.round(Math.sin(frame*0.03+i)*10),s[1],s[2],s[3],(frame/20)|0));
  const cols=[CG,CL,CC,CY,CO,CP,CPU];
  const bw=14,bh=14,gap=6,total=7*bw+6*gap;
  let bx=(W-total)/2;const by=H/2-50;
  for(let i=0;i<7;i++){
    const c=cols[(i+((frame/10)|0))%7];
    nRectb(bx,by,bw,bh,c,CGR);rect(bx+1,by+1,bw-2,bh-2,c);bx+=bw+gap;
  }
  const titleStr="LINE BOY";
  g.font="700 34px \"HP Sans\",sans-serif";
  const twd=g.measureText(titleStr).width;
  let cx=(W-twd)/2;const ty=by+bh+48;
  for(let i=0;i<titleStr.length;i++){
    const ch=titleStr[i],cw=g.measureText(ch).width;
    if(ch!==" "){g.fillStyle=PAL[cols[(i+((frame/10)|0))%7]];g.textAlign="left";g.fillText(ch,cx,ty)}
    cx+=cw;
  }
  if(((frame/20)|0)%2===0)text("Aボタン（スペース）でスタート",W/2,H/2+64,14,CY,"center");
  const theme=THEMES[world];
  const st="◀ WORLD "+(world+1)+": "+theme.name+" ▶";
  g.font="14px \"HP Sans\",sans-serif";
  const swd=g.measureText(st).width,sx=(W-swd)/2,sy=H/2+104;
  rect(sx-8,sy-16,swd+16,24,CB);nRectb(sx-8,sy-16,swd+16,24,theme.ground);
  text(st,sx,sy,14,theme.ground);
  text("左右で移動／Aでジャンプ／敵は踏める",W/2,H-28,12,CGR,"center");
}
function stepTitle(){
    if(frame%3===0){
      const cols=[CG,CC,CL,CO,CP,CPU,CY];
      titlePts.push(mkParticle(ri(Math.random,10,W-10),ri(Math.random,H/2+40,H-20),
        rr(Math.random,-0.6,0.6),rr(Math.random,-2.5,-0.8),cols[(Math.random()*7)|0],
        ri(Math.random,40,90),[0,2,3][(Math.random()*3)|0],-0.01));
    }
    for(const p of titlePts)updParticle(p);
    titlePts=titlePts.filter(p=>p.life>0&&p.y>-10);
    if(HP.left()&&!step._pl){world=(world+THEMES.length-1)%THEMES.length;HP.beep(660,0.05,"square",0.03)}
    if(HP.right()&&!step._pr){world=(world+1)%THEMES.length;HP.beep(660,0.05,"square",0.03)}
    step._pl=HP.left();step._pr=HP.right();
    if(aHit()){go("play");startLevel()}
    drawTitle();
    return;
}
function stepEnd(){
    overTimer++;
    for(const p of parts)updParticle(p);
    parts=parts.filter(p=>p.life>0);
    drawBG();drawTerrain();
    for(const e of level.enemies)if(e.alive)drawEnemy(e,camX);
    if(boss&&boss.alive)drawBoss(boss,camX);
    drawPlayer(player,camX,THEMES[world].ground);
    for(const p of parts)drawParticle(p,camX);
    drawHUD();
    if(state==="over"){
      text("GAME OVER",W/2,H/2-10,30,CR,"center");
      if(overTimer>60)text("Aボタンでタイトルへ",W/2,H/2+24,14,CW,"center");
      if(overTimer>60&&aHit())go("title");
    }else{
      text("CLEAR!",W/2,H/2-10,30,CY,"center");
      text("スコア "+(scoreTotal+player.score),W/2,H/2+20,14,CW,"center");
      if(overTimer>60)text("Aボタンで次のワールドへ",W/2,H/2+44,13,CW,"center");
      if(overTimer>60&&aHit()){
        scoreTotal+=player.score;world=(world+1)%THEMES.length;
        go("play");startLevel();
      }
    }
    return;
}
function stepPlay(){
  // play
  const lv=level,p=player,col=THEMES[world].ground;
  if(!bossOn&&p.x>LEVEL_W-400){bossOn=true;shake=20}
  updPlayer(p,lv.data,lv.enemies,lv.items,bossOn?boss:null,parts,col);
  if(!p.alive){shake=15;go("over");overTimer=0;drawPlay();return}
  if(bossOn&&boss.alive){
    updBoss(boss,p);
    if(frame%3===0){
      const a=frame*0.15;
      for(const rad of [boss.size+2,boss.size-10])
        parts.push(mkParticle(boss.x+Math.cos(a)*rad,boss.y+Math.sin(a)*rad,
          rr(Math.random,-0.5,0.5),rr(Math.random,-0.5,0.5),boss.col,20,3,0));
    }
  }
  if(bossOn&&!boss.alive&&!boss.bursted){
    boss.bursted=true;
    for(let i=0;i<40;i++)parts.push(mkParticle(boss.x,boss.y,rr(Math.random,-6,6),rr(Math.random,-7,0),[CY,CW,CC,CL,CP][(Math.random()*5)|0],60,[0,1,3][(Math.random()*3)|0],0.15));
    for(let i=0;i<20;i++)parts.push(mkParticle(boss.x,boss.y,rr(Math.random,-4,4),rr(Math.random,-5,0),boss.col,45,2,0.1));
    HP.beep(220,0.2,"square",0.05);
  }
  if(bossOn&&!boss.alive&&p.x>=lv.goalX){go("clear");overTimer=0;drawPlay();return}
  for(const e of lv.enemies)if(e.alive)updEnemy(e,lv.data.segs,lv.data.plats);
  for(const pt of parts)updParticle(pt);
  parts=parts.filter(pt=>pt.life>0);
  const target=clamp(p.x-W/3,0,LEVEL_W-W);
  camX+=(target-camX)*0.12;
  if(shake>0)shake--;
  drawPlay();
}
const SC=HP.scene({title:{frame:stepTitle},play:{frame:stepPlay},over:{frame:stepEnd},clear:{frame:stepEnd}},"title");
function go(name){state=name;SC.go(name)}
function step(){
  frame++;
  tapNow=tapA;tapA=false;
  SC.frame();
}
function drawPlay(){
  g.save();
  if(shake>0)g.translate(rr(Math.random,-shake,shake)/4,rr(Math.random,-shake,shake)/4);
  drawBG();drawTerrain();
  for(const e of level.enemies)if(e.alive)drawEnemy(e,camX);
  if(boss&&boss.alive&&bossOn)drawBoss(boss,camX);
  drawPlayer(player,camX,THEMES[world].ground);
  for(const p of parts)drawParticle(p,camX);
  g.restore();
  drawHUD();
}
// fixed-step loop (60Hz, same feel as the original)
let acc=0;
HP.loop(function(dt){
  acc+=dt;
  const h=1/60;let n=0;
  while(acc>=h&&n<4){step();acc-=h;n++}
  if(n===4)acc=0;
});
</script>

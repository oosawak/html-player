<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src https://oosawak.github.io 'unsafe-inline'; connect-src 'none'; form-action 'none'">
<link rel="stylesheet" href="https://oosawak.github.io/html-player/assets/fonts.css">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>リングバースト ― 円形攻撃の宇宙戦記</title>
<script src="https://oosawak.github.io/html-player/assets/hp.js?v=7"></script>
<style>body{margin:0;background:#0a0616;color:#f0eaff;font-family:"HP Denki",sans-serif;text-align:center}#w{max-width:480px;margin:auto;padding:10px}h1{font-size:19px;margin:4px}canvas{width:100%;background:#070313;border:1px solid #5a489e;border-radius:6px;touch-action:none;display:block;margin:8px auto}.note{font-family:"HP Denki",sans-serif;font-size:12px;color:#8d7fc0;line-height:1.7;text-align:left}</style></head><body><div id="w">
<h1>リングバースト</h1>
<canvas id="cv" width="480" height="360"></canvas>
<div class="note">・タッチ（ドラッグ）か十字キーで移動<br>・玉は自動追尾。ゲージ満タンでタップ（Aでも可）で円形バースト<br>・敵に当たるとエネルギー減。0でミッション失敗</div>
</div><script>
"use strict";
const cv=document.getElementById("cv"),g=cv.getContext("2d");
const W=480,H=360;
const F='"HP Denki",sans-serif';
let state=0,score=0,best=0,energy=100,gauge=0,invuln=0,spawnT=0,t=0,playT=0,fireWait=0;
try{best=+localStorage.getItem("rb")||0}catch(e){}
const ship={x:W/2,y:H-56,ang:-Math.PI/2,aim:-Math.PI/2,aimT:9};
let foes=[],burst=null,bullets=[];
let touch=null,downAt=0,downPos=null,moved=false;
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener("pointerdown",e=>{
const p=pos(e);touch=p;downAt=performance.now();downPos=p;moved=false;
if(state!==1)start();
});
cv.addEventListener("pointermove",e=>{
if(!touch)return;
const p=pos(e);touch=p;
if(downPos&&Math.hypot(p.x-downPos.x,p.y-downPos.y)>14)moved=true;
});
addEventListener("pointerup",()=>{
if(state===1&&touch&&!moved&&performance.now()-downAt<300)fire();
touch=null;
});
function start(){
state=1;score=0;energy=100;gauge=0;playT=0;foes=[];burst=null;bullets=[];spawnT=0;invuln=0;
ship.x=W/2;ship.y=H-56;ship.ang=-Math.PI/2;
}
function fire(){
if(state!==1||gauge<100||burst)return;
burst={r:12};gauge=0;HP.beep(160,0.3,"sawtooth",0.05);
}
function circle(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
HP.loop(dt=>{
t+=dt;
if(state!==1&&HP.bHit())start();
if(state===1&&HP.aHit())fire();
g.fillStyle="#070313";g.fillRect(0,0,W,H);
if(state===1){
playT+=dt;ship.aimT+=dt;
gauge=Math.min(100,gauge+22*dt);
fireWait-=dt;
if(fireWait<=0){
let tgt=null,bd=40000;
for(const f of foes){const dd=(f.x-ship.x)**2+(f.y-ship.y)**2;if(dd<bd){bd=dd;tgt=f}}
if(tgt){
const a=Math.atan2(tgt.y-ship.y,tgt.x-ship.x);
ship.aim=a;ship.aimT=0;
bullets.push({x:ship.x,y:ship.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,tgt:tgt,life:0.75});
fireWait=0.3;
}
}
let mx=0,my=0;
if(HP.left())mx-=1;
if(HP.right())mx+=1;
if(HP.up())my-=1;
if(HP.down())my+=1;
if(touch&&moved){
const dx=touch.x-ship.x,dy=touch.y-ship.y,dd=Math.hypot(dx,dy);
if(dd>6){mx=dx/dd;my=dy/dd}
}
if(mx||my){
const ml=Math.hypot(mx,my);
ship.x+=mx/ml*205*dt;ship.y+=my/ml*205*dt;
ship.ang=Math.atan2(my,mx);
}
ship.x=Math.max(14,Math.min(W-14,ship.x));
ship.y=Math.max(30,Math.min(H-14,ship.y));
energy=Math.min(100,energy+6*dt);
spawnT-=dt;
if(spawnT<=0){
const a=Math.random()*Math.PI*2,big=Math.random()<0.12,r=big?24:9+Math.random()*7;
foes.push({x:ship.x+Math.cos(a)*330,y:ship.y+Math.sin(a)*330,r:r,big:big,hp:5,vy:(big?17:30)+Math.random()*26+playT*0.7,col:big?"#d88f2c":(r<13?"#c06ae0":"#e05252")});
spawnT=Math.max(0.3,1.0-playT*0.012);
}
if(invuln>0)invuln-=dt;
if(burst){
burst.r+=280*dt;
const br=burst.r;
foes=foes.filter(f=>{
if(Math.hypot(f.x-ship.x,f.y-ship.y)<=br+10){
if(f.big){f.hp-=3;if(f.hp>0)return true;score+=500}
else score+=f.r<13?150:100;
return false;
}
return true;
});
if(br>175)burst=null;
}
}
bullets.forEach(b=>{
b.life-=dt;
if(b.tgt&&foes.indexOf(b.tgt)>=0){
const a=Math.atan2(b.tgt.y-b.y,b.tgt.x-b.x);
b.vx=Math.cos(a)*300;b.vy=Math.sin(a)*300;
}
b.x+=b.vx*dt;b.y+=b.vy*dt;
});
bullets=bullets.filter(b=>b.life>0&&!b.hit);
foes.forEach(f=>{
const a=Math.atan2(ship.y-f.y,ship.x-f.x);
f.x+=Math.cos(a)*f.vy*dt;f.y+=Math.sin(a)*f.vy*dt;
});
if(state===1){
foes=foes.filter(f=>{
for(const b of bullets){
if(!b.hit&&Math.hypot(b.x-f.x,b.y-f.y)<f.r+3){
b.hit=true;HP.beep(220,0.06);
if(f.big){f.hp--;if(f.hp>0)return true;score+=500}
else score+=f.r<13?150:100;
return false;
}
}
if(invuln<=0&&Math.hypot(ship.x-f.x,ship.y-f.y)<f.r+11){
energy-=f.big?18:12;invuln=f.big?1:0.8;HP.beep(90,0.25,"sawtooth",0.05);
if(f.big){const a=Math.atan2(f.y-ship.y,f.x-ship.x);f.x+=Math.cos(a)*34;f.y+=Math.sin(a)*34;return true}
return false;
}
return true;
});
if(energy<=0){energy=0;state=2;if(score>best){best=score;try{localStorage.setItem("rb",best)}catch(e){}}}
}
foes.forEach(f=>{circle(f.x,f.y,f.r,f.col);if(f.big)HP.bar(g,f.x-18,f.y-f.r-11,36,5,f.hp/5,"#ffd94a")});
bullets.forEach(b=>circle(b.x,b.y,3,"#ffe9a8"));
if(burst){
g.strokeStyle="#ffd94a";g.lineWidth=5;
g.beginPath();g.arc(ship.x,ship.y,burst.r,0,7);g.stroke();
}
if(state!==2&&!(invuln>0&&((t*10)|0)%2)){
g.save();g.translate(ship.x,ship.y);g.rotate(ship.aimT<0.3?ship.aim:ship.ang);
g.fillStyle="#57b7ff";
g.beginPath();g.moveTo(15,0);g.lineTo(-11,-11);g.lineTo(-5,0);g.lineTo(-11,11);g.closePath();g.fill();
g.restore();
}
HP.text(g,"SCORE "+score,10,18,14,"#f0eaff",null,F);
HP.text(g,"HI "+best,W-10,18,14,"#f0eaff","right",F);
HP.text(g,"ENERGY",10,36,14,"#f0eaff",null,F);
HP.bar(g,76,26,150,10,energy/100,energy>30?"#57e08a":"#e05252");
HP.text(g,"BURST",246,36,14,"#f0eaff",null,F);
HP.bar(g,300,26,150,10,gauge/100,gauge>=100?"#ffd94a":"#8d7fc0");
if(state===0)HP.title(g,W,H,"RING BURST",["敵は全方位から来る。玉は自動追尾","ゲージ満タンでタップするとバースト","Bボタンかタップでスタート"],"#f0eaff",F);
if(state===2)HP.title(g,W,H,"SIGNAL LOST",["MISSION FAILED ― SCORE "+score,"Bボタンかタップでもう一度"],"#f0eaff",F);
});
</script></body></html>
